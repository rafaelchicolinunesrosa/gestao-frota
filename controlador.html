  <!-- Interceptor vanilla imediato caso o React falhe em inicializar -->
  <script>
    window.startupErrors = [];
    window.addEventListener('error', function(e) {
      window.startupErrors.push({
        message: e.message,
        filename: e.filename ? e.filename.split('/').pop() : 'unknown',
        lineno: e.lineno,
        colno: e.colno,
        stack: e.error ? e.error.stack : null
      });

      // Tenta limpar caches e desregistrar Service Workers para forçar a recuperação em segundo plano
      try {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) { caches.delete(key); });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
      } catch (err) {
        console.error('Erro ao limpar cache:', err);
      }
      
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.innerHTML.includes('Carregando Painel do Supervisor...')) {
          root.innerHTML = `
            <div class="flex items-center justify-center min-h-screen bg-[#050811] text-white p-6 w-full">

                </div>

      }, 300);

    // Função global para gerar PDF do histórico operacional de uma viatura
    function gerarRelatorioPDF(viatura) {
      const printWindow = window.open('', '_blank');
      
      const avariasAtivas = viatura.avarias_ativas || [];
      const historico = viatura.historico || [];
      
      const historicoHTML = historico.map(h => {
        let tag = '';
        let cor = '';
        if (h.tipo === 'baixa') {
          tag = 'BAIXA OPERACIONAL';
          cor = 'color: #e11d48; font-weight: bold;';
        } else if (h.tipo === 'retorno_servico') {
          tag = 'RETORNO A SERVIÇO';
          cor = 'color: #0d9488; font-weight: bold;';
        } else if (h.tipo === 'avaria_registrada') {
          tag = 'AVARIA REGISTRADA';
          cor = 'color: #d97706; font-weight: bold;';
        } else if (h.tipo === 'avaria_resolvida') {
          tag = 'AVARIA RESOLVIDA/CONSERTADA';
          cor = 'color: #2563eb; font-weight: bold;';
        } else if (h.tipo === 'plantao_encerrado') {
          tag = 'PLANTÃO ENCERRADO';
          cor = 'color: #64748b; font-weight: bold;';
        }
        
        return `
          <tr style="border-bottom: 1px solid #eee;">
            <td style="padding: 10px; font-size: 12px; color: #555;">${new Date(h.data).toLocaleString('pt-BR')}</td>
            <td style="padding: 10px; font-size: 12px; ${cor}">${tag}</td>
            <td style="padding: 10px; font-size: 12px; color: #333;">
              ${h.observacao || ''}
              ${h.avaria_descricao ? `<div style="margin-top: 4px;"><b>Descrição da Avaria:</b> ${h.avaria_descricao}</div>` : ''}
              ${h.origem ? `<div style="margin-top: 2px; font-size: 10px; color: #777;"><b>Registrado em:</b> ${h.origem}</div>` : ''}
            </td>
          </tr>
        `;
      }).reverse().join('');

      const avariasHTML = avariasAtivas.map(av => `
        <div style="border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: flex; gap: 15px; align-items: center; background: #fafafa;">
          ${av.fotoUrl ? `<img src="${av.fotoUrl}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ccc;" />` : ''}
          <div>
            <p style="margin: 0; font-weight: bold; font-size: 13px; color: #222;">${av.descricao}</p>
            <p style="margin: 4px 0 0 0; font-size: 11px; color: #666;">Registrado em: ${new Date(av.data_registro).toLocaleDateString('pt-BR')}</p>
          </div>
        </div>
      `).join('') || '<p style="font-style: italic; color: #777; font-size: 12px;">Nenhuma avaria ativa registrada no momento.</p>';

      printWindow.document.write(`
        <html>
          <head>
            <title>Histórico Operacional - ${viatura.prefixo}</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 30px; color: #333; line-height: 1.6; background-color: #fff; }
              h1 { margin: 0 0 5px 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
              h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #333; padding-bottom: 6px; margin: 30px 0 15px 0; font-weight: 750; }
              .header { border-bottom: 3px double #333; padding-bottom: 18px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end; }
              .meta-grid { display: grid; grid-template-cols: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
              .meta-box { border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; background: #f8fafc; }
              .meta-label { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
              .meta-val { font-size: 16px; font-weight: 850; margin-top: 4px; color: #1e293b; }
              table { width: 100%; border-collapse: collapse; margin-top: 15px; }
              th { background: #f1f5f9; padding: 10px; border: 1px solid #cbd5e1; text-align: left; font-size: 11px; text-transform: uppercase; font-weight: bold; color: #475569; }
              td { border: 1px solid #e2e8f0; }
              .btn-print { padding: 10px 18px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
              .btn-print:hover { background: #4338ca; }
              @media print {

            </style>
          </head>
          <body>

              <div>
                <h1>Histórico Operacional de Veículo</h1>
                <p style="margin: 0; color: #64748b; font-size: 13px;">Relatório Oficial de Frota DEMUTRAN & Auditoria de Ativos</p>

            <div style="margin-top: 60px; border-top: 1px solid #e2e8f0; padding-top: 20px; font-size: 11px; color: #94a3b8; text-align: center;">

            </div>

        </html>
      `);
      printWindow.document.close();

    // Função global para gerar PDF do relatório de perdas
    function gerarRelatorioPerdasPDF(lots, dataInicio, dataFim) {

      const rowsHTML = lots.map(lot => {
        const materialName = lot.outro_material || lot.material_id;

        return `

              ${isBaixado 
                ? `<span style="color: #0d9488; font-weight: bold; font-size: 10px; text-transform: uppercase;">BAIXADO</span>
                   ${lot.baixa_obs ? `<div style="font-size: 9px; color: #777; font-style: italic; margin-top: 2px;">"${lot.baixa_obs}"</div>` : ''}` 
                : '<span style="color: #e11d48; font-weight: bold; font-size: 10px; text-transform: uppercase;">PENDENTE</span>'}

          </tr>
        `;

      printWindow.document.write(`
        <html>

              .btn-print { padding: 10px 18px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

    const { useState, useEffect, useRef } = React;

    // React Error Boundary para capturar erros em componentes filhos
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      componentDidCatch(error, errorInfo) {
        this.setState({ hasError: true, error: error });
        console.error("React Error Boundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex items-center justify-center p-8 w-full flex-grow">
              <div className="text-center space-y-4 max-w-sm glass-card p-6 rounded-3xl border border-rose-500/20 shadow-2xl">
                <div className="inline-flex p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl mb-2">

                </div>
                <h2 className="text-xl font-bold font-outfit text-rose-300">Erro na Interface</h2>
                <p className="text-sm text-slate-400 leading-relaxed">
                  Ocorreu uma falha ao renderizar o painel. Detalhes técnicos:
                </p>
                <div className="text-left bg-rose-950/40 border border-rose-500/30 rounded-xl p-3.5 mt-3 text-xs font-mono text-rose-300 overflow-x-auto">
                  <div className="font-bold text-sm">❌ {this.state.error && this.state.error.message}</div>
                </div>

          );

        return this.props.children;

    // ==========================================
    // TELA 2: DASHBOARD PRINCIPAL
    // ==========================================
    function DashboardConsole({ user, onLogout }) {
      const [tab, setTab] = useState('frota'); // 'frota' | 'checklists' | 'estoque' | 'cadastros' | 'seguranca'
      const [viaturas, setViaturas] = useState([]);
      const [materiais, setMateriais] = useState([]);
      const [agentes, setAgentes] = useState([]);
      const [checklists, setChecklists] = useState([]);
      const [selectedPrefixo, setSelectedPrefixo] = useState('');
      
      const [modalManutencao, setModalManutencao] = useState(false);
      const [filtroDataInicio, setFiltroDataInicio] = useState('');
      const [filtroDataFim, setFiltroDataFim] = useState('');
      
      // Inputs de manutenção
      const [odoManutencao, setOdoManutencao] = useState('');
      const [intervaloManutencao, setIntervaloManutencao] = useState('5000');

      // Inputs para gerenciar materiais
      const [novoMaterialNome, setNovoMaterialNome] = useState('');
      const [novoMaterialQtd, setNovoMaterialQtd] = useState('');

      // Estados do sistema de segurança por dispositivos
      const [dispositivos, setDispositivos] = useState([]);
      const [codigosAtivos, setCodigosAtivos] = useState([]);
      const [codigoGerado, setCodigoGerado] = useState('');
      const [tempoRestanteCodigo, setTempoRestanteCodigo] = useState(0);
      const [expandedPhoto, setExpandedPhoto] = useState(null);
      const [filtroViaturaAuditoria, setFiltroViaturaAuditoria] = useState('');

      // Estados do sistema de backup e restauração
      const [fazendoBackup, setFazendoBackup] = useState(false);
      const [restaurandoBackup, setRestaurandoBackup] = useState(false);

      useEffect(() => {
        if (!window.FirebaseApp) return;

        // Carrega dados iniciais e escuta em tempo real
        const unsubVtr = listenTodasViaturas((data) => {
          setViaturas(data);
        });

        const unsubMat = listenMateriais((data) => {
          setMateriais(data);
        });

        const unsubChecklist = listenTodosChecklists((data) => {
          setChecklists(data);
        });

        const unsubAgentes = getAgentes((data) => {
          setAgentes(data);
        });

        const unsubDev = listenDispositivos((data) => {
          setDispositivos(data);
        });

        const unsubCod = listenCodigosAtivacaoAtivos((data) => {
          setCodigosAtivos(data);
          if (data.length > 0) {
            const maisRecente = data[0];
            const restante = Math.max(0, Math.ceil((maisRecente.expira_em - Date.now()) / 1000));
            setCodigoGerado(maisRecente.codigo);
            setTempoRestanteCodigo(restante);
          } else {
            setCodigoGerado('');
            setTempoRestanteCodigo(0);
          }
        });

        return () => {
          unsubVtr();
          unsubMat();
          unsubChecklist();
          if (unsubAgentes) unsubAgentes();
          unsubDev();
          unsubCod();
        };
      }, []);

      // Efeito de regressão do cronômetro do código de ativação
      useEffect(() => {
        if (tempoRestanteCodigo <= 0) return;
        const interval = setInterval(() => {
          setTempoRestanteCodigo(prev => {
            if (prev <= 1) {
              clearInterval(interval);
              setCodigoGerado('');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [tempoRestanteCodigo]);

      useEffect(() => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }, [tab, viaturas, checklists, selectedPrefixo, modalManutencao, materiais, dispositivos, codigosAtivos, codigoGerado, expandedPhoto, filtroViaturaAuditoria]);

      // Métricas
      const totalViaturas = viaturas.length;
      const emOperacao = viaturas.filter(v => v.status_atual === 'em_operacao').length;
      const disponiveis = viaturas.filter(v => v.status_atual === 'disponivel').length;
      const emBaixa = viaturas.filter(v => v.status_atual === 'baixada').length;

      // Calcular trocas pendentes
      const trocasPendentes = viaturas.filter(v => {
        if (!v.regras_manutencao) return false;
        const meta = v.regras_manutencao.troca_oleo_odometro_meta || 0;
        return v.odometro_atual >= meta - 500;
      }).length;

      const selectedVtr = viaturas.find(v => v.prefixo === selectedPrefixo);

      const checklistsFiltrados = filtroViaturaAuditoria
        ? checklists.filter(c => c.viatura_id === filtroViaturaAuditoria)
        : checklists;

      // Obter lotes de rua ativos reativamente
      const activeLots = checklistsFiltrados.flatMap(c => {
        return (c.movimentacoes || [])
          .filter(m => m.tipo === 'deixei_via' && m.quantidade_restante > 0)
          .map(m => ({
            ...m,
            viatura_id: c.viatura_id,
            checklist_id: c.id,
            agente_nome: c.abertura?.equipe?.[0]?.nome || 'Desconhecido'
          }));
      });

      // Lotes que foram marcados como não encontrados em algum momento
      const rawLostLots = checklistsFiltrados.flatMap(c => {
        return (c.movimentacoes || [])
          .filter(m => m.tipo === 'deixei_via' && m.nao_encontrado)
          .map(m => ({
            ...m,
            viatura_id: c.viatura_id,
            checklist_id: c.id,
            agente_nome: c.abertura?.equipe?.[0]?.nome || 'Desconhecido'
          }));
      });

      // Ordenar do mais recente para o mais antigo e aplicar filtros de data
      const lostLots = rawLostLots
        .sort((a, b) => new Date(b.data) - new Date(a.data))
        .filter(lot => {
          if (filtroDataInicio) {
            const dateLot = new Date(lot.data);
            const dateStart = new Date(filtroDataInicio + 'T00:00:00');
            if (dateLot < dateStart) return false;
          }
          if (filtroDataFim) {
            const dateLot = new Date(lot.data);
            const dateEnd = new Date(filtroDataFim + 'T23:59:59');
            if (dateLot > dateEnd) return false;
          }
          return true;
        });

      // Metas de troca de óleo
      const getOleoStatus = (vtr) => {
        if (!vtr.regras_manutencao) return { status: 'ok', texto: 'N/A', cor: 'text-emerald-400', progress: 100, badgeColor: 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' };
        const meta = vtr.regras_manutencao.troca_oleo_odometro_meta || 0;
        const ultima = vtr.regras_manutencao.ultima_troca_oleo_odometro || 0;
        const odo = vtr.odometro_atual || 0;
        
        const vidaUtilTotal = Math.max(1, meta - ultima);
        const restante = Math.max(0, meta - odo);
        const progress = Math.min(100, Math.max(0, (restante / vidaUtilTotal) * 100));

        if (odo >= meta) {
          return { status: 'critico', texto: 'Vencida!', cor: 'text-rose-400', progress, badgeColor: 'bg-rose-500/15 border-rose-500/20 text-rose-400 animate-pulse' };
        } else if (restante <= 500) {
          return { status: 'aviso', texto: `Revisar (${restante} km)`, cor: 'text-amber-400', progress, badgeColor: 'bg-amber-500/15 border-amber-500/20 text-amber-400' };
        }
        return { status: 'ok', texto: `OK (${restante} km)`, cor: 'text-emerald-400', progress, badgeColor: 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' };
      };

      const handleRegistrarOleo = async (e) => {
        e.preventDefault();
        if (!odoManutencao || isNaN(odoManutencao)) {
          alert('Por favor, insira uma quilometragem numérica.');
          return;
        }
        const odo = parseInt(odoManutencao);
        const inter = parseInt(intervaloManutencao);
        const novaMeta = odo + inter;

        try {
          await registrarTrocaOleo(selectedPrefixo, odo, novaMeta);
          setModalManutencao(false);
          setOdoManutencao('');
          alert(`Óleo registrado com sucesso! Próxima troca agendada para ${novaMeta} km.`);
        } catch (err) {
          alert('Erro ao salvar no banco.');
        }
      };

      const handleAdicionarMaterial = async () => {
        if (!novoMaterialNome.trim()) {
          alert('Por favor, informe o nome do material.');
          return;
        }
        const qtd = parseInt(novoMaterialQtd) || 0;
        if (qtd < 0) {
          alert('A quantidade não pode ser negativa.');
          return;
        }

        try {
          await adicionarMaterialCustom(novoMaterialNome.trim(), qtd);
          setNovoMaterialNome('');
          setNovoMaterialQtd('');
          alert(`Material "${novoMaterialNome.trim()}" adicionado com sucesso!`);
        } catch (err) {
          alert('Erro ao adicionar o material: ' + err.message);
        }
      };

      const handleGerarCodigo = async () => {
        try {
          const code = await gerarCodigoAtivacao();
          setCodigoGerado(code);
          setTempoRestanteCodigo(600);
        } catch (err) {
          alert("Erro ao gerar código: " + err.message);
        }
      };

      const handleBloquearDispositivo = async (uuid) => {
        if (confirm("Deseja realmente revogar o acesso deste dispositivo? Ele será impedido de usar o aplicativo móvel imediatamente.")) {
          try {
            await revogarDispositivo(uuid);
          } catch (err) {
             alert("Erro ao revogar acesso: " + err.message);
          }
        }
      };

      const handleAutorizarDispositivo = async (uuid, nome) => {
        try {
          await autorizarDispositivo(uuid, nome);
        } catch (err) {
          alert("Erro ao autorizar dispositivo: " + err.message);
        }
      };

      const handleExcluirDispositivo = async (uuid) => {
        if (confirm("Deseja realmente excluir permanentemente este dispositivo? Ele será removido completamente do banco de dados.")) {
          try {
            await deletarDispositivo(uuid);
          } catch (err) {
            alert("Erro ao excluir dispositivo: " + err.message);
          }
        }
      };

      const handleExcluirAgente = async (matricula) => {
        if (confirm("Deseja realmente excluir permanentemente este agente?")) {
          try {
            await deletarAgente(matricula);
          } catch (err) {
            alert("Erro ao excluir agente: " + err.message);
          }
        }
      };

      const handleExcluirViatura = async (prefixo) => {
        if (confirm(`Deseja realmente excluir permanentemente a viatura ${prefixo}? Todos os registros de status vinculados a ela serão deletados.`)) {
          try {
            await deletarViatura(prefixo);
          } catch (err) {
            alert("Erro ao excluir viatura: " + err.message);
          }
        }
      };

      const handleDownloadBackup = async () => {
        setFazendoBackup(true);
        try {
          const backupData = await backupBancoDeDados();
          const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(
            JSON.stringify(backupData, null, 2)
          )}`;
          const downloadAnchor = document.createElement('a');
          const dataAtual = new Date().toISOString().split('T')[0];
          downloadAnchor.setAttribute('href', jsonString);
          downloadAnchor.setAttribute('download', `backup_frota_demutran_${dataAtual}.json`);
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          downloadAnchor.remove();
        } catch (err) {
          console.error("Erro ao gerar download de backup:", err);
          alert("Não foi possível gerar a cópia de segurança: " + err.message);
        } finally {
          setFazendoBackup(false);
        }
      };

      const handleUploadBackup = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const backupObj = JSON.parse(event.target.result);
            if (!backupObj || !backupObj.dados) {
              alert("Erro: Arquivo de backup com formato inválido ou corrompido.");
              return;
            }

            const confirmacao = confirm(
              "⚠️ AVISO CRÍTICO DE RESTAURAÇÃO!\n\n" +
              "Você está prestes a substituir todos os dados atuais do banco de dados por esta cópia de segurança.\n" +
              "Esta ação é irreversível e apagará quaisquer modificações feitas após a data de criação deste backup.\n\n" +
              "Deseja prosseguir com a restauração por completo?"
            );

            if (!confirmacao) {
              e.target.value = ''; // Limpa o input
              return;
            }

            setRestaurandoBackup(true);
            await restaurarBancoDeDados(backupObj);
            alert("✅ Restauração do banco de dados concluída com sucesso! A página será recarregada.");
            window.location.reload();
          } catch (err) {
            console.error("Erro na restauração de dados:", err);
            alert("Não foi possível restaurar os dados: " + err.message);
            setRestaurandoBackup(false);
          }
        };
        reader.readAsText(file);
      };

      return (

                <p class="text-slate-400 text-xs mt-0.5 flex items-center gap-1.5">

              <div class="flex bg-slate-900/60 p-1 border border-slate-800 rounded-xl">

                >

                  alt="Foto ampliada" 
                  class="max-w-full max-h-[80vh] object-contain rounded-2xl border border-white/10 shadow-2xl" 
                  onClick={(e) => e.stopPropagation()}
                />
              </div>
            </div>
          )}

          <footer class="py-3 text-center text-xs text-slate-500 border-t border-slate-900 bg-[#04060d]">
            Frota DEMUTRAN v1.0.0 (Painel do Controlador)
          </footer>
        </div>
      );
    }

    // ==========================================
    // COMPONENTE: FORM CADASTRO AGENTE
    // ==========================================
    function FormCadastrarAgente() {
      const [matricula, setMatricula] = useState('');
      const [nome, setNome] = useState('');
      const [salvando, setSalvando] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!matricula.trim() || !nome.trim()) {
          alert('Por favor, informe a matrícula e o nome.');
          return;
        }

        setSalvando(true);
        try {
          await adicionarAgente(matricula.trim(), nome.trim());
          setMatricula('');
          setNome('');
          alert('Agente operacional cadastrado com sucesso!');
        } catch (err) {
          alert(err.message || 'Erro ao cadastrar.');
        } finally {
          setSalvando(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} class="space-y-3">
          <div>
            <label class="block text-2xs text-slate-500 mb-1">Matrícula (Apenas Números)</label>
            <input
              type="text"
              required
              placeholder="Ex: 100206"
              value={matricula}
              onChange={(e) => setMatricula(e.target.value.replace(/\D/g, ''))}
              class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs focus:outline-none"
            />
          </div>
          <div>
            <label class="block text-2xs text-slate-500 mb-1">Nome Completo</label>
            <input
              type="text"
              required
              placeholder="Ex: Agente Costa"
              value={nome}
              onChange={(e) => setNome(e.target.value)}
              class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs focus:outline-none"
            />
          </div>
          <button
            type="submit"
            disabled={salvando}
            class="btn-tactile w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-all shadow-md"
          >
            {salvando ? 'Salvando...' : 'CADASTRAR AGENTE'}
          </button>
        </form>
      );
    }

    // ==========================================
    // COMPONENTE: FORM CADASTRO SUPERVISOR
    // ==========================================
    function FormCadastrarSupervisor() {
      const [email, setEmail] = useState('');
      const [senha, setSenha] = useState('');
      const [salvando, setSalvando] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!email.trim() || !senha.trim()) {
          alert('Por favor, informe o e-mail e a senha.');
          return;
        }

        setSalvando(true);
        try {
          await adicionarSupervisor(email.trim(), senha);
          if (isDemoMode) {
            alert('Controlador cadastrado localmente no Simulador!');
          } else {
            alert(`Controlador "${email.trim()}" cadastrado com sucesso no Firebase em nuvem!`);
          }
          setEmail('');
          setSenha('');
        } catch (err) {
          alert('Erro ao cadastrar controlador: ' + (err.message || err));
        } finally {
          setSalvando(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} class="space-y-3">
          <div>
            <label class="block text-2xs text-slate-500 mb-1">E-mail / Usuário de Acesso</label>
            <input
              type="text"
              required
              placeholder="Ex: controlador2@frota.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs focus:outline-none"
            />
          </div>
          <div>
            <label class="block text-2xs text-slate-500 mb-1">Senha de Acesso</label>
            <input
              type="password"
              required
              placeholder="Ex: frota123"
              value={senha}
              onChange={(e) => setSenha(e.target.value)}
              class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs focus:outline-none"
            />
          </div>
          <button
            type="submit"
            disabled={salvando}
            class="btn-tactile w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-all shadow-md"
          >
            {salvando ? 'Salvando...' : 'CADASTRAR CONTROLADOR'}
          </button>
        </form>
      );
    }

    // ==========================================
    // COMPONENTE: FORM CADASTRO VIATURA
    // ==========================================
    function FormCadastrarViatura() {
      const [tipo, setTipo] = useState('VTR');
      const [numero, setNumero] = useState('');
      const [fotos, setFotos] = useState(['', '', '']);
      const [loadingFotos, setLoadingFotos] = useState([false, false, false]);
      const [salvando, setSalvando] = useState(false);

      const handleFotoChange = (index, value) => {
        const updated = [...fotos];
        updated[index] = value;
        setFotos(updated);
      };

      const handleUploadFoto = async (index, file) => {
        if (!file) return;
        setLoadingFotos(prev => {
          const updated = [...prev];
          updated[index] = true;
          return updated;
        });
        try {
          const url = await uploadFoto(file);
          handleFotoChange(index, url);
        } catch (err) {
          alert('Erro ao carregar a foto: ' + err.message);
        } finally {
          setLoadingFotos(prev => {
            const updated = [...prev];
            updated[index] = false;
            return updated;
          });
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!numero.trim()) {
          alert('Por favor, informe o número da viatura.');
          return;
        }

        const prefixo = `${tipo}-${numero.trim().padStart(2, '0')}`;
        setSalvando(true);
        try {
          const fotosFiltradas = fotos.filter(f => f.trim() !== '');
          await adicionarViatura(prefixo, tipo, fotosFiltradas);
          setNumero('');
          setFotos(['', '', '']);
          alert(`Veículo ${prefixo} cadastrado com sucesso na frota!`);
        } catch (err) {
          alert(err.message || 'Erro ao cadastrar.');
        } finally {
          setSalvando(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-2xs text-slate-500 mb-1">Tipo</label>
              <select
                value={tipo}
                onChange={(e) => setTipo(e.target.value)}
                class="glass-input w-full px-3 py-2.5 rounded-xl text-xs focus:outline-none"
              >
                <option value="VTR">VTR (Carro)</option>
                <option value="VTM">VTM (Moto)</option>
              </select>
            </div>
            <div>
              <label class="block text-2xs text-slate-500 mb-1">Número do Veículo</label>
              <input
                type="text"
                required
                placeholder="Ex: 09"
                value={numero}
                onChange={(e) => setNumero(e.target.value.replace(/\D/g, ''))}
                class="glass-input w-full px-3.5 py-2.5 rounded-xl text-xs focus:outline-none"
              />
            </div>
          </div>
          
          <div class="space-y-2">
            <label class="block text-2xs text-slate-500 font-bold uppercase tracking-wider mb-1">Fotos de Vistoria de Entrada</label>
            <div class="grid grid-cols-3 gap-3">
              {fotos.map((f, i) => {
                const isLoading = loadingFotos[i];
                return (
                  <div key={i} class="relative flex flex-col items-center justify-center border border-dashed border-slate-700 bg-slate-900/30 rounded-2xl p-2 h-24 hover:bg-slate-900/50 transition-all">
                    {isLoading ? (
                      <div class="flex flex-col items-center justify-center gap-1">
                        <div class="w-5 h-5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                        <span class="text-[8px] text-slate-400 uppercase font-bold">Enviando...</span>
                      </div>
                    ) : f ? (
                      <div class="relative w-full h-full group overflow-hidden rounded-xl">
                        <img
                          src={f}
                          alt={`Vistoria ${i+1}`}
                          class="w-full h-full object-cover rounded-xl"
                          onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=80&q=80'; }}
                        />
                        <button
                          type="button"
                          onClick={() => handleFotoChange(i, '')}
                          class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center text-rose-400 font-bold text-2xs transition-all rounded-xl"
                        >
                          <span class="flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                            Remover
                          </span>
                        </button>
                        <button
                          type="button"
                          onClick={() => handleFotoChange(i, '')}
                          class="absolute top-1 right-1 bg-rose-600/90 text-white rounded-full p-1 shadow hover:scale-105 active:scale-95 transition-all md:hidden"
                        >
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                      </div>
                    ) : (
                      <>
                        <button
                          type="button"
                          onClick={() => document.getElementById(`foto-vistoria-input-${i}`).click()}
                          class="w-full h-full flex flex-col items-center justify-center text-slate-400 gap-1 hover:text-indigo-400 transition-all btn-tactile"
                        >
                          <span class="p-1.5 bg-slate-900 border border-slate-800 rounded-xl text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M14.5 2H9.5L7 5H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4z"/><circle cx="12" cy="13" r="3"/></svg>
                          </span>
                          <span class="text-[8px] uppercase font-bold tracking-wider">Foto {i+1}</span>
                        </button>
                        <input
                          id={`foto-vistoria-input-${i}`}
                          type="file"
                          accept="image/*"
                          onChange={(e) => {
                            if (e.target.files[0]) handleUploadFoto(i, e.target.files[0]);
                          }}
                          class="hidden"
                        />
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          <button
            type="submit"
            disabled={salvando}
            class="btn-tactile w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-all shadow-md mt-2"
          >
            {salvando ? 'Salvando...' : 'CADASTRAR VEÍCULO'}
          </button>
        </form>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
