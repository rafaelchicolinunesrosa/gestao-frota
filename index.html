  <script>
    window.startupErrors = [];
    window.addEventListener('error', function(e) {
      window.startupErrors.push({
        message: e.message,
        filename: e.filename ? e.filename.split('/').pop() : 'unknown',
        lineno: e.lineno,
        colno: e.colno,
        stack: e.error ? e.error.stack : null
      });

      // Tenta limpar caches e desregistrar Service Workers para forçar a recuperação em segundo plano
      try {
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) { caches.delete(key); });
          });
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
      } catch (err) {
        console.error('Erro ao limpar cache:', err);
      }

      // Injeção vanilla imediata caso o React falhe em inicializar
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.innerHTML.includes('Carregando Controle Operacional...')) {
          root.innerHTML = `
            <div class="flex items-center justify-center min-h-screen bg-[#080c14] text-white p-6 w-full">
              <div class="text-center space-y-4 max-w-sm bg-[#1e293b]/70 backdrop-blur-md border border-rose-500/20 p-6 rounded-3xl shadow-2xl">
                <div class="inline-flex p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl mb-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-8.5 h-8.5 text-rose-400 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                </div>
                <h2 class="text-xl font-bold font-outfit text-rose-300">Erro de Inicialização</h2>
                <p class="text-sm text-slate-400 leading-relaxed">
                  Ocorreu uma falha crítica ao carregar o aplicativo no navegador. Detalhes:
                </p>
                <div class="text-left bg-rose-950/40 border border-rose-500/30 rounded-xl p-3.5 mt-3 text-xs font-mono text-rose-300 overflow-x-auto space-y-1">
                  <div class="font-bold text-sm">❌ ${e.message}</div>
                  <div class="opacity-90">Arquivo: <span class="text-white font-bold">${e.filename ? e.filename.split('/').pop() : 'unknown'}</span> (Linha ${e.lineno}:${e.colno})</div>
                </div>
                <button onclick="window.location.reload()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-semibold transition-all mt-4 shadow-lg border border-slate-700/50">
                  Recarregar Página
                </button>
              </div>
            </div>
          `;
        }
      }, 300);
    });
  </script>

  <script type="text/babel">
    const firebaseApp = window.FirebaseApp || {};
    const {

    const { useState, useEffect, useRef } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }

      componentDidCatch(error, errorInfo) {
        this.setState({
          hasError: true,
          error: error,
          errorInfo: errorInfo
        });
        console.error("React Error Boundary caught:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="flex items-center justify-center p-6 w-full flex-grow">
              <div className="text-center space-y-4 max-w-sm glass-card p-6 rounded-3xl border border-rose-500/20 shadow-2xl">

                </div>

                  <div className="font-bold text-sm">❌ {this.state.error && this.state.error.message}</div>
                  {this.state.error && this.state.error.stack && (
                    <pre className="text-2xs opacity-75 mt-1.5 whitespace-pre-wrap leading-tight font-mono max-h-32 no-scrollbar overflow-y-auto">
                      {this.state.error.stack.substring(0, 300)}...
                    </pre>
                  )}
                </div>
                <button onClick={() => window.location.reload()} className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-semibold transition-all mt-4 shadow-lg border border-slate-700/50">
                  Recarregar Página
                </button>
              </div>
            </div>
          );
        }

        return this.props.children;
      }
    }

    function ScreenDispositivoBloqueado({ deviceUuid }) {
      const [nomeAparelho, setNomeAparelho] = useState('');
      const [codigoAtivacao, setCodigoAtivacao] = useState('');
      const [loading, setLoading] = useState(false);
      const [erro, setErro] = useState('');
      const [copiado, setCopiado] = useState(false);
      const [sucesso, setSucesso] = useState(false);

      useEffect(() => {
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }, [erro, copiado, sucesso]);

      const handleCopiarId = () => {
        navigator.clipboard.writeText(deviceUuid);
        setCopiado(true);
        setTimeout(() => setCopiado(false), 2000);
      };

      const handleAtivar = async (e) => {
        e.preventDefault();
        setErro('');

        if (!nomeAparelho.trim()) {
          setErro('Por favor, informe uma identificação para este aparelho.');
          return;
        }

        if (codigoAtivacao.trim().length !== 6 || isNaN(codigoAtivacao.trim())) {
          setErro('O código de ativação deve possuir exatamente 6 números.');
          return;
        }

        setLoading(true);
        try {
          await registrarDispositivoPeloCodigo(deviceUuid, codigoAtivacao.trim(), nomeAparelho.trim());
          setSucesso(true);
          setTimeout(() => {
            window.location.reload();
          }, 1500);
        } catch (err) {
          setLoading(false);
          setErro(err.message || 'Código de ativação inválido ou expirado.');
        }
      };

      if (sucesso) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6 bg-[#080c14] text-white">
            <div className="text-center space-y-6 max-w-sm glass-card p-8 rounded-3xl border border-emerald-500/20 shadow-2xl">
              <div className="inline-flex p-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-3xl shadow-lg shadow-emerald-500/10 animate-bounce">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              </div>
              <div className="space-y-2">
                <h2 className="text-2xl font-black font-outfit text-emerald-300">Aparelho Autorizado!</h2>
                <p className="text-sm text-slate-400 leading-relaxed">
                  Este dispositivo foi cadastrado com sucesso. Liberando acesso operacional...
                </p>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-[#080c14] text-white">
          <div className="w-full max-w-sm glass-card rounded-3xl p-6 space-y-6 shadow-2xl border border-slate-900">
            
            <div className="text-center space-y-3">
              <div className="inline-flex p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl animate-pulse shadow-lg shadow-rose-500/5">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              </div>
              <h1 className="text-2xl font-extrabold font-outfit text-white tracking-tight">Acesso Bloqueado</h1>
              <p className="text-slate-400 text-xs leading-relaxed max-w-[280px] mx-auto">
                Este dispositivo móvel ainda não está autorizado para operar no Frota DEMUTRAN.
              </p>
            </div>

            <div className="p-4 bg-slate-900/60 border border-slate-800/80 rounded-2xl space-y-2">
              <div className="flex justify-between items-center text-3xs font-bold text-slate-500 uppercase tracking-widest">
                <span>ID do Aparelho (UUID)</span>
                {copiado ? (
                  <span className="text-emerald-400">Copiado!</span>
                ) : (
                  <button onClick={handleCopiarId} className="text-indigo-400 hover:text-indigo-300 font-bold transition-all lowercase">copiar</button>
                )}
              </div>
              <div className="font-mono text-2xs text-slate-300 break-all select-all">
                {deviceUuid}
              </div>
            </div>

            <form onSubmit={handleAtivar} className="space-y-4">
              <div>
                <label className="block text-3xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Identificação do Aparelho*</label>
                <input
                  type="text"
                  required
                  placeholder="Ex: Celular Base - Moto 03"
                  value={nomeAparelho}
                  onChange={(e) => setNomeAparelho(e.target.value)}
                  className="glass-input w-full px-4 py-3 rounded-xl text-xs focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-3xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Código de Ativação da Base*</label>
                <input
                  type="text"
                  required
                  pattern="[0-9]*"
                  inputMode="numeric"
                  maxLength={6}
                  placeholder="Ex: 184932"
                  value={codigoAtivacao}
                  onChange={(e) => setCodigoAtivacao(e.target.value.replace(/\D/g, ''))}
                  className="glass-input w-full px-4 py-3.5 rounded-xl text-center text-xl font-bold font-outfit tracking-widest text-indigo-300 focus:outline-none focus:border-indigo-500"
                />
                <span className="text-4xs text-slate-500 mt-1 block text-center">Código de 6 dígitos gerado no painel do supervisor.</span>
              </div>

              {erro && (
                <div className="p-3.5 bg-rose-500/10 border border-rose-500/20 text-rose-300 text-2xs rounded-xl flex items-start gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                  <span>{erro}</span>
                </div>
              )}

              <button
                type="submit"
                disabled={loading}
                className="btn-tactile w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-xl text-xs font-bold tracking-wider transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 disabled:opacity-50"
              >
                {loading ? (
                  <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                ) : (
                  <>
                    <span>SOLICITAR AUTORIZAÇÃO</span>
                    <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                  </>
                )}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState('acesso');
      const [loading, setLoading] = useState(false);
      
      const [vtrTipo, setVtrTipo] = useState('VTR');
      const [vtrNumero, setVtrNumero] = useState('');
      const [prefixoAtivo, setPrefixoAtivo] = useState('');
      const [viaturaData, setViaturaData] = useState(null);
      const [checklistAtivo, setChecklistAtivo] = useState(null);

      const [listaAgentes, setListaAgentes] = useState([]);
      const [listaMateriais, setListaMateriais] = useState([]);
      const [listaViaturas, setListaViaturas] = useState([]);

      // Controle de segurança e autorização do dispositivo
      const [deviceStatus, setDeviceStatus] = useState('loading'); // 'loading' | 'authorized' | 'unauthorized'
      const [deviceData, setDeviceData] = useState(null);
      const deviceUuidRef = useRef('');
      const [authError, setAuthError] = useState(null);

      useEffect(() => {
        let active = true;
        let unsubDev = null;
        let unsubAgentes = null;
        let unsubMat = null;
        let unsubViaturas = null;
        let timer = null;

        function startAuthAndListeners() {
          loginAgenteAnomino()
            .then(user => {
              if (!active) return;
              console.log("Sessão segura inicializada:", user.uid);
              
              // 1. Iniciar verificação do dispositivo
              let uuid = localStorage.getItem('device_uuid');
              if (!uuid) {
                uuid = 'dev_' + Math.random().toString(36).substring(2, 10) + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('device_uuid', uuid);
              }
              deviceUuidRef.current = uuid;

              unsubDev = verificarDispositivo(uuid, (data) => {
                if (!active) return;
                if (data && data.status === 'autorizado') {
                  setDeviceStatus('authorized');
                  setDeviceData(data);
                } else {
                  setDeviceStatus('unauthorized');
                  setDeviceData(null);
                }
              });

              // 2. Iniciar outros listeners do banco de dados
              unsubAgentes = getAgentes((agentes) => {
                if (active) setListaAgentes(agentes);
              });

              unsubMat = listenMateriais((materiais) => {
                if (active) setListaMateriais(materiais);
              });

              unsubViaturas = listenTodasViaturas((viaturas) => {
                if (active) setListaViaturas(viaturas);
              });
            })
            .catch(err => {
              if (!active) return;
              console.error("Erro ao inicializar sessão segura:", err);
              setAuthError({
                code: err.code || 'erro-autenticacao',
                message: err.message || 'Não foi possível estabelecer login anônimo com o Firebase.'
              });
              setDeviceStatus('unauthorized'); // Libera o estado de loading para exibir o erro
            });
        }

        if (!window.FirebaseApp || !window.FirebaseApp.verificarDispositivo) {
          timer = setInterval(() => {
            if (window.FirebaseApp && window.FirebaseApp.verificarDispositivo) {
              clearInterval(timer);
              startAuthAndListeners();
            }
          }, 100);
        } else {
          startAuthAndListeners();
        }

        return () => {
          active = false;
          if (timer) clearInterval(timer);
          if (unsubDev) unsubDev();
          if (unsubAgentes) unsubAgentes();
          if (unsubMat) unsubMat();
          if (unsubViaturas) unsubViaturas();
        };
      }, []);

      // Identificar agentes em uso em OUTRAS viaturas
      const agentesDisponiveis = React.useMemo(() => {
        const nomesEmUso = new Set();
        listaViaturas.forEach(vtr => {
          if (vtr.prefixo !== prefixoAtivo && vtr.status_atual === 'em_operacao' && vtr.equipe_atual && Array.isArray(vtr.equipe_atual)) {
            vtr.equipe_atual.forEach(member => {
              if (member && member.nome) {
                nomesEmUso.add(member.nome.trim().toLowerCase());
              }
            });
          }
        });
        return listaAgentes.filter(ag => !nomesEmUso.has(ag.nome.trim().toLowerCase()));
      }, [listaAgentes, listaViaturas, prefixoAtivo]);

      useEffect(() => {
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      }, [screen, loading, listaMateriais, listaAgentes, listaViaturas]);

      useEffect(() => {
        if (!window.FirebaseApp || !prefixoAtivo) return;

        const unsubVtr = listenViatura(prefixoAtivo, (data) => {
          setViaturaData(data);
          
          if (data && data.status_atual === 'em_operacao' && data.id_checklist_atual) {
            setChecklistAtivo(data.id_checklist_atual);
            setScreen('servico');
          } else if (data && data.status_atual === 'disponivel' && screen === 'servico') {
            setScreen('acesso');
            setChecklistAtivo(null);
          }
        });

        return () => unsubVtr();
      }, [prefixoAtivo]);

      const [checklistData, setChecklistData] = useState(null);
      useEffect(() => {
        if (!window.FirebaseApp || !checklistAtivo) return;

        const unsubChecklist = listenChecklist(checklistAtivo, (data) => {
          setChecklistData(data);
        });

        return () => unsubChecklist();
      }, [checklistAtivo]);

      if (!window.FirebaseApp) {
        const errorDetails = window.startupErrors && window.startupErrors.length > 0
          ? window.startupErrors.map((err, i) => (
              <div key={i} className="text-left bg-rose-950/40 border border-rose-500/30 rounded-xl p-3.5 mt-3 text-xs font-mono text-rose-300 overflow-x-auto space-y-1 max-h-40 no-scrollbar">
                <div className="font-bold text-sm">❌ {err.message}</div>
                <div className="opacity-90">Arquivo: <span className="text-white font-bold">{err.filename}</span> (Linha {err.lineno}:{err.colno})</div>
                {err.stack && <pre className="text-2xs opacity-75 mt-1.5 whitespace-pre-wrap leading-tight font-mono">{err.stack.substring(0, 400)}...</pre>}
              </div>
            ))
          : <div className="text-xs text-slate-500 mt-2">Nenhum erro de script capturado no console.</div>;

        return (
          <div className="flex items-center justify-center min-h-screen bg-[#080c14] text-white p-6">
            <div className="text-center space-y-4 max-w-sm glass-card p-6 rounded-3xl border border-rose-500/20">
              <div className="inline-flex p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-8 h-8 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              </div>
              <h2 className="text-xl font-bold font-outfit text-rose-300">Erro de Carregamento</h2>
              <p className="text-sm text-slate-400 leading-relaxed">
                Não foi possível inicializar os recursos do banco de dados (<code>firebase.js</code>). Certifique-se de que os arquivos estão na mesma pasta e recarregue.
              </p>
              {errorDetails}
              <button onClick={() => window.location.reload()} className="w-full btn-tactile py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-semibold transition-all mt-4">
                Recarregar Página
              </button>
            </div>
          </div>
        );
      }

      if (authError) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-[#080c14] text-white p-6">
            <div className="text-center space-y-4 max-w-sm glass-card p-6 rounded-3xl border border-rose-500/20 shadow-2xl">
              <div className="inline-flex p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-8.5 h-8.5 text-rose-400 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              </div>
              <h2 className="text-xl font-bold font-outfit text-rose-300">Falha de Autenticação</h2>
              <p className="text-sm text-slate-400 leading-relaxed">
                Não foi possível estabelecer uma sessão segura com o servidor do Firebase.
              </p>
              <div className="text-left bg-rose-950/40 border border-rose-500/30 rounded-xl p-3.5 mt-3 text-xs text-rose-300 space-y-2 leading-relaxed">
                <div className="font-bold font-mono">❌ {authError.code || 'Erro desconhecido'}</div>
                <div>{authError.message}</div>
                {authError.code === 'auth/operation-not-allowed' && (
                  <div className="pt-2 border-t border-rose-500/20 text-white font-medium">
                    💡 <b>Como resolver:</b> Acesse o Console do Firebase &gt; Authentication &gt; Sign-in method (Método de login), ative o provedor <b>Anônimo (Anonymous)</b> e salve as alterações. Depois, recarregue esta página.
                  </div>
                )}
              </div>
              <button onClick={() => window.location.reload()} className="w-full btn-tactile py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-sm font-semibold transition-all mt-4 border border-slate-700/50">
                Recarregar Página
              </button>
            </div>
          </div>
        );
      }

      if (deviceStatus === 'loading') {
        return (
          <div className="flex items-center justify-center min-h-screen bg-[#080c14] text-white p-6">
            <div className="text-center space-y-4 max-w-sm glass-card p-6 rounded-3xl border border-slate-850 shadow-2xl">
              <div className="inline-block w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
              <p className="mt-4 text-slate-400 font-medium text-sm">Verificando segurança do dispositivo...</p>
            </div>
          </div>
        );
      }

      if (deviceStatus === 'unauthorized') {
        return (
          <ScreenDispositivoBloqueado 
            deviceUuid={deviceUuidRef.current} 
          />
        );
      }

      return (
        <div className="flex flex-col min-h-screen justify-between bg-[#080c14] relative">
          
          {isDemoMode && (
            <div class="bg-amber-500/25 border-b border-amber-500/30 text-amber-300 py-1 text-center text-xs font-semibold tracking-wide flex items-center justify-center gap-1">
              <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
              Modo de Demonstração (Banco de Dados Local)
            </div>
          )}

          <main class="flex-grow flex flex-col p-4 pb-8 overflow-y-auto">
            <ErrorBoundary>
              {screen === 'acesso' && (
                <ScreenAcesso 
                  vtrTipo={vtrTipo}
                  setVtrTipo={setVtrTipo}
                  vtrNumero={vtrNumero}
                  setVtrNumero={setVtrNumero}
                  setPrefixoAtivo={setPrefixoAtivo}
                  setScreen={setScreen}
                  setLoading={setLoading}
                  loading={loading}
                />
              )}

              {screen === 'abertura' && viaturaData && (
                <ScreenAbertura 
                  prefixo={prefixoAtivo}
                  viatura={viaturaData}
                  listaAgentes={agentesDisponiveis}
                  listaMateriais={listaMateriais}
                  setChecklistAtivo={setChecklistAtivo}
                  setScreen={setScreen}
                  voltar={() => setScreen('acesso')}
                />
              )}

              {screen === 'servico' && checklistData && viaturaData && (
                <ScreenServico 
                  prefixo={prefixoAtivo}
                  viatura={viaturaData}
                  checklist={checklistData}
                  listaMateriais={listaMateriais}
                  listaAgentes={agentesDisponiveis}
                  setScreen={setScreen}
                />
              )}

              {screen === 'encerramento' && checklistData && viaturaData && (
                <ScreenEncerramento 
                  prefixo={prefixoAtivo}
                  viatura={viaturaData}
                  checklist={checklistData}
                  listaMateriais={listaMateriais}
                  voltar={() => setScreen('servico')}
                  finalizar={() => {
                    setScreen('acesso');
                    setPrefixoAtivo('');
                    setChecklistAtivo(null);
                  }}
                />
              )}
            </ErrorBoundary>
          </main>

          <footer class="py-3 text-center text-xs text-slate-500 border-t border-slate-900 bg-[#060a10]">
            Frota DEMUTRAN v1.0.0
          </footer>
        </div>
      );
    }

    // ==========================================
    // TELA A: ACESSO SEM SENHA
    // ==========================================
    function ScreenAcesso({ vtrTipo, setVtrTipo, vtrNumero, setVtrNumero, setPrefixoAtivo, setScreen, setLoading, loading }) {
      const [erro, setErro] = useState('');
      const [deferredPrompt, setDeferredPrompt] = useState(window.deferredPrompt);
      const [isStandalone, setIsStandalone] = useState(false);

      useEffect(() => {
        const checkStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
        setIsStandalone(!!checkStandalone);

        const handlePrompt = () => {
          setDeferredPrompt(window.deferredPrompt);
        };

        window.addEventListener('pwa-prompt-available', handlePrompt);
        return () => {
          window.removeEventListener('pwa-prompt-available', handlePrompt);
        };
      }, []);

      const handleInstallClick = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          setDeferredPrompt(null);
          window.deferredPrompt = null;
        }
      };

      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      const handleAcessar = async (e) => {
        e.preventDefault();
        setErro('');

        if (!vtrNumero || isNaN(vtrNumero)) {
          setErro('Por favor, digite apenas números para identificar a viatura.');
          return;
        }

        const prefixo = `${vtrTipo}-${vtrNumero.trim().padStart(2, '0')}`;
        setLoading(true);

        try {
          listenViatura(prefixo, (data) => {
            setLoading(false);
            if (!data) {
              setErro(`Viatura ${prefixo} não cadastrada no sistema.`);
              return;
            }

            if (data.status_atual === 'baixada') {
              setErro(`⛔ Viatura ${prefixo} encontra-se indisponível (BAIXADA / FORA DE SERVIÇO).`);
              return;
            }

            setPrefixoAtivo(prefixo);

            if (data.status_atual === 'em_operacao' && data.id_checklist_atual) {
              console.log("Viatura ativa detectada, sincronizando dispositivos...");
              setScreen('servico');
            } else {
              setScreen('abertura');
            }
          });
        } catch (err) {
          setLoading(false);
          setErro('Falha na comunicação com o banco. Tente novamente.');
        }
      };

      return (
        <div class="flex-grow flex flex-col justify-center max-w-sm mx-auto w-full">
          <div class="text-center mb-8">
            <div class="inline-flex p-3 bg-indigo-600/10 border border-indigo-500/20 text-indigo-400 rounded-2xl mb-3">
              <i data-lucide="shield-alert" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-extrabold font-outfit tracking-tight text-white">Frota DEMUTRAN</h1>
            <p class="text-slate-400 text-sm mt-1">Acesso Rápido para Agentes de Trânsito</p>
          </div>

          <form onSubmit={handleAcessar} class="glass-card rounded-3xl p-6 space-y-6">
            
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 text-center">Tipo de Viatura</label>
              <div class="grid grid-cols-2 gap-4">
                <button
                  type="button"
                  onClick={() => setVtrTipo('VTR')}
                  class={`btn-tactile py-4 px-6 rounded-2xl border transition-all duration-200 flex flex-col items-center gap-2 ${
                    vtrTipo === 'VTR' 
                      ? 'bg-indigo-600 border-indigo-500 text-white font-bold shadow-lg shadow-indigo-600/30' 
                      : 'bg-navy-900/60 border-slate-800 text-slate-400 font-medium hover:border-slate-700'
                  }`}
                >
                  <i data-lucide="car" class="w-7 h-7"></i>
                  <span class="text-sm">VTR (Carro)</span>
                </button>
                <button
                  type="button"
                  onClick={() => setVtrTipo('VTM')}
                  class={`btn-tactile py-4 px-6 rounded-2xl border transition-all duration-200 flex flex-col items-center gap-2 ${
                    vtrTipo === 'VTM' 
                      ? 'bg-indigo-600 border-indigo-500 text-white font-bold shadow-lg shadow-indigo-600/30' 
                      : 'bg-navy-900/60 border-slate-800 text-slate-400 font-medium hover:border-slate-700'
                  }`}
                >
                  <i data-lucide="bike" class="w-7 h-7"></i>
                  <span class="text-sm">VTM (Moto)</span>
                </button>
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Número do Veículo</label>
              <div class="relative">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold font-outfit text-xl text-slate-500">
                  {vtrTipo}-
                </span>
                <input
                  type="text"
                  pattern="[0-9]*"
                  inputMode="numeric"
                  placeholder="Ex: 12"
                  value={vtrNumero}
                  onChange={(e) => setVtrNumero(e.target.value.replace(/\D/g, ''))}
                  class="glass-input w-full pl-20 pr-4 py-4 rounded-2xl text-2xl font-bold font-outfit tracking-wide text-white focus:outline-none text-left"
                />
              </div>
            </div>

            {erro && (
              <div class="p-4 bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm rounded-xl flex items-start gap-2">
                <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
                <span>{erro}</span>
              </div>
            )}

            <button
              type="submit"
              disabled={loading}
              class="btn-tactile w-full py-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-2xl text-base font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20 disabled:opacity-50"
            >
              {loading ? (
                <div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
              ) : (
                <>
                  <span>ACESSAR VIATURA</span>
                  <span><i data-lucide="arrow-right" class="w-5 h-5"></i></span>
                </>
              )}
            </button>

          </form>

          {/* Assistente de Instalação PWA */}
          {!isStandalone && (
            <div class="mt-6 p-4 rounded-3xl bg-slate-900/40 border border-slate-800/80 space-y-3 text-xs text-slate-300">
              <div class="flex items-center gap-2 text-indigo-400 font-bold font-outfit uppercase tracking-wider text-2xs">
                <svg xmlns="http://www.w3.org/2050/svg" class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Assistente de Instalação</span>
              </div>
              
              {deferredPrompt ? (
                <div class="space-y-2">
                  <p class="text-slate-400 text-3xs leading-relaxed">
                    Instale o app diretamente no celular. É rápido, leve e não gasta memória do aparelho.
                  </p>
                  <button
                    type="button"
                    onClick={handleInstallClick}
                    class="btn-tactile w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-md shadow-indigo-600/10"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>INSTALAR COMO APLICATIVO</span>
                  </button>
                </div>
              ) : isIOS ? (
                <div class="space-y-1.5 leading-relaxed text-3xs text-slate-400">
                  <p class="text-slate-300 font-semibold">📲 Instalação no iPhone:</p>
                  <ol class="list-decimal list-inside space-y-1 pl-1 text-slate-400">
                    <li>Toque no botão de <b>Compartilhar</b> (ícone <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 inline-block align-text-bottom mx-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><line x1="12" y1="2" x2="12" y2="15"/><polyline points="17 7 12 2 7 7"/></svg> na barra do Safari).</li>
                    <li>Role a lista para baixo e toque em <b>"Adicionar à Tela de Início"</b>.</li>
                  </ol>
                </div>
              ) : (
                <div class="space-y-1.5 leading-relaxed text-3xs text-slate-400">
                  <p class="text-slate-300 font-semibold">💡 O botão de instalar não aparece?</p>
                  <ul class="list-disc list-inside space-y-1 pl-1 text-slate-400">
                    <li>Navegadores integrados (ex: <b>WhatsApp</b>) bloqueiam instalações.</li>
                    <li>Toque nos <b>3 pontinhos</b> no topo da tela e selecione <b>"Abrir no Chrome"</b>.</li>
                    <li>No Chrome, toque nos <b>3 pontinhos</b> e escolha <b>"Instalar aplicativo"</b> ou <b>"Adicionar à tela inicial"</b>.</li>
                  </ul>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // TELA B: ABERTURA DE CHECK-LIST (CHECK-IN)
    // ==========================================
    function ScreenAbertura({ prefixo, viatura, listaAgentes, listaMateriais, setChecklistAtivo, setScreen, voltar }) {
      const [condutor, setCondutor] = useState('');
      const [patrulheiros, setPatrulheiros] = useState([]);
      const [novoPatrulheiro, setNovoPatrulheiro] = useState('');
      const [odometro, setOdometro] = useState(viatura.odometro_atual || '');
      const [combustivel, setCombustivel] = useState(viatura.combustivel_atual || '1/2');
      const [checklistItens, setChecklistItens] = useState({});
      const [cargaInicial, setCargaInicial] = useState({});
      const [fotos, setFotos] = useState([]);
      const [avariaCiente, setAvariaCiente] = useState(false);
      const [erro, setErro] = useState('');
      const [salvando, setSalvando] = useState(false);

      const [novasAvariasPerg, setNovasAvariasPerg] = useState(false);
      const [novasAvariasDesc, setNovasAvariasDesc] = useState('');
      const [novasAvariasFoto, setNovasAvariasFoto] = useState('');
      const [listaNovasAvarias, setListaNovasAvarias] = useState([]);
      const [observacoes, setObservacoes] = useState('');

      const [loadingFotoAbertura, setLoadingFotoAbertura] = useState(false);
      const [loadingFotoAvaria, setLoadingFotoAvaria] = useState(false);

      const handleFotoUpload = async (file) => {
        if (!file) return;
        setLoadingFotoAbertura(true);
        try {
          const url = await uploadFoto(file);
          setFotos(prev => [...prev, url]);
        } catch (err) {
          alert('Erro ao carregar a foto: ' + err.message);
        } finally {
          setLoadingFotoAbertura(false);
        }
      };

      const handleFotoAvaria = async (file) => {
        if (!file) return;
        setLoadingFotoAvaria(true);
        try {
          const url = await uploadFoto(file);
          setNovasAvariasFoto(url);
        } catch (err) {
          alert('Erro ao carregar a foto de avaria: ' + err.message);
        } finally {
          setLoadingFotoAvaria(false);
        }
      };

      const handleAddAvaria = () => {
        if (!novasAvariasDesc.trim()) {
          alert('Por favor, digite a descrição da avaria.');
          return;
        }
        const nova = {
          id: 'AV_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          descricao: novasAvariasDesc.trim(),
          fotoUrl: novasAvariasFoto,
          data_registro: new Date().toISOString()
        };
        setListaNovasAvarias(prev => [...prev, nova]);
        setNovasAvariasDesc('');
        setNovasAvariasFoto('');
      };

      const handleRemoveAvaria = (id) => {
        setListaNovasAvarias(prev => prev.filter(av => av.id !== id));
      };

      const [outroNome, setOutroNome] = useState('');
      const [outroQtd, setOutroQtd] = useState('');
      const [adicionandoMaterial, setAdicionandoMaterial] = useState(false);

      const handleAddOutroMaterial = async () => {
        if (!outroNome.trim()) {
          alert('Por favor, digite o nome do material.');
          return;
        }
        const qtd = parseInt(outroQtd);
        if (isNaN(qtd) || qtd <= 0) {
          alert('Por favor, informe uma quantidade maior que zero.');
          return;
        }

        setAdicionandoMaterial(true);
        try {
          const matId = await adicionarMaterialCustom(outroNome.trim());
          
          setCargaInicial(prev => ({
            ...prev,
            [matId]: (prev[matId] || 0) + qtd
          }));
          
          setOutroNome('');
          setOutroQtd('');
        } catch (err) {
          alert('Erro ao adicionar material personalizado.');
        } finally {
          setAdicionandoMaterial(false);
        }
      };

      const itensChecklist = prefixo.startsWith('VTR') 
        ? ['Nível de Água', 'Nível de Óleo', 'Giroflex', 'Rádio Comunicador'] 
        : ['Nível de Óleo', 'Relação', 'Giroflex'];

      useEffect(() => {
        setCargaInicial(prev => {
          const novaCarga = { ...prev };
          listaMateriais.forEach(mat => {
            if (novaCarga[mat.id] === undefined) {
              novaCarga[mat.id] = 0;
            }
          });
          return novaCarga;
        });
      }, [listaMateriais]);

      useEffect(() => {
        const check = {};
        itensChecklist.forEach(item => {
          check[item] = true;
        });
        setChecklistItens(check);
      }, [prefixo]);

      useEffect(() => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }, [listaNovasAvarias, novasAvariasPerg, novasAvariasFoto]);

      const [showCondutorDropdown, setShowCondutorDropdown] = useState(false);
      const [filteredCondutores, setFilteredCondutores] = useState([]);
      const [showPatrulheiroDropdown, setShowPatrulheiroDropdown] = useState(false);
      const [filteredPatrulheiros, setFilteredPatrulheiros] = useState([]);

      const handleCondutorInput = (val) => {
        setCondutor(val);
        if (val.trim() === '') {
          setFilteredCondutores([]);
          setShowCondutorDropdown(false);
        } else {
          const matched = listaAgentes.filter(ag => 
            ag.nome.toLowerCase().includes(val.toLowerCase()) || 
            ag.matricula.includes(val)
          );
          setFilteredCondutores(matched);
          setShowCondutorDropdown(true);
        }
      };

      const handlePatrulheiroInput = (val) => {
        setNovoPatrulheiro(val);
        if (val.trim() === '') {
          setFilteredPatrulheiros([]);
          setShowPatrulheiroDropdown(false);
        } else {
          const matched = listaAgentes.filter(ag => 
            (ag.nome.toLowerCase().includes(val.toLowerCase()) || 
             ag.matricula.includes(val)) &&
            ag.nome !== condutor &&
            !patrulheiros.includes(ag.nome)
          );
          setFilteredPatrulheiros(matched);
          setShowPatrulheiroDropdown(true);
        }
      };

      const handleAddPatrulheiro = () => {
        if (!novoPatrulheiro.trim()) return;
        const ag = listaAgentes.find(a => a.nome === novoPatrulheiro);
        const nomeParaAdd = ag ? ag.nome : novoPatrulheiro;
        
        if (!patrulheiros.includes(nomeParaAdd)) {
          setPatrulheiros([...patrulheiros, nomeParaAdd]);
        }
        setNovoPatrulheiro('');
        setFilteredPatrulheiros([]);
        setShowPatrulheiroDropdown(false);
      };

      const handleCargaAlteracao = (id, change) => {
        setCargaInicial(prev => {
          const novoValor = Math.max(0, (prev[id] || 0) + change);
          const materialBase = listaMateriais.find(m => m.id === id);
          if (materialBase && novoValor > materialBase.quantidade_patio) {
            alert(`⚠️ Estoque do Pátio insuficiente! Total disponível: ${materialBase.quantidade_patio}`);
            return prev;
          }
          return { ...prev, [id]: novoValor };
        });
      };



      const handleConfirmarAbertura = async () => {
        setErro('');
        
        if (!condutor) {
          setErro('Informe o Condutor / Piloto da Viatura.');
          window.scrollTo(0, 0);
          return;
        }

        if (!odometro || isNaN(odometro)) {
          setErro('Informe um odômetro inicial numérico válido.');
          window.scrollTo(0, 0);
          return;
        }

        if (odometro < viatura.odometro_atual) {
          setErro(`Odômetro menor que o registrado na abertura (${viatura.odometro_atual} km).`);
          window.scrollTo(0, 0);
          return;
        }

        if ((viatura.avarias_ativas || []).length > 0 && !avariaCiente) {
          setErro('Você precisa dar ciência nas avarias pré-existentes.');
          return;
        }

        if (novasAvariasPerg && listaNovasAvarias.length === 0 && !novasAvariasDesc.trim()) {
          setErro('Por favor, informe a descrição detalhada de pelo menos uma nova avaria.');
          return;
        }

        if (fotos.length < 1) {
          setErro('Adicione pelo menos 1 foto do veículo na abertura.');
          return;
        }

        setSalvando(true);

        const condutorAgente = listaAgentes.find(a => a.nome === condutor);
        const equipeFormata = [
          {
            nome: condutorAgente ? condutorAgente.nome : condutor,
            matricula: condutorAgente ? condutorAgente.matricula : 'N/A',
            papel: prefixo.startsWith('VTR') ? 'Condutor' : 'Piloto'
          }
        ];

        patrulheiros.forEach(p => {
          const ag = listaAgentes.find(a => a.nome === p);
          equipeFormata.push({
            nome: ag ? ag.nome : p,
            matricula: ag ? ag.matricula : 'N/A',
            papel: 'Patrulheiro'
          });
        });

        let avariasParaEnviar = [...listaNovasAvarias];
        if (novasAvariasPerg && novasAvariasDesc.trim()) {
          avariasParaEnviar.push({
            descricao: novasAvariasDesc.trim(),
            fotoUrl: novasAvariasFoto,
            data_registro: new Date().toISOString()
          });
        }

        const aberturaData = {
          equipe: equipeFormata,
          odometro: parseInt(odometro),
          combustivel,
          fotos,
          carga_inicial: cargaInicial,
          avarias_cientes: (viatura.avarias_ativas || []).map(av => av.descricao),
          itens_inspecionados: checklistItens,
          observacoes: observacoes.trim(),
          novas_avarias: novasAvariasPerg ? avariasParaEnviar.map(av => ({
            descricao: av.descricao,
            fotoUrl: av.fotoUrl || '',
            data_registro: av.data_registro || new Date().toISOString()
          })) : []
        };

        try {
          const checklistId = await abrirChecklist(prefixo, aberturaData);
          setChecklistAtivo(checklistId);
          setScreen('servico');
        } catch (err) {
          console.error(err);
          setErro(`Erro ao registrar a abertura no banco. Detalhes: ${err.message || err}`);
        } finally {
          setSalvando(false);
        }
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <button onClick={voltar} class="p-2 bg-slate-800/40 rounded-xl text-slate-400 hover:text-white">
              <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <div class="text-right">
              <h2 class="text-2xl font-bold font-outfit text-white">{prefixo}</h2>
              <p class="text-xs text-slate-400">Check-in de Abertura de Plantão</p>
            </div>
          </div>

          {erro && (
            <div class="p-4 bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm rounded-xl flex items-start gap-2">
              <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
              <span>{erro}</span>
            </div>
          )}

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
              <i data-lucide="users" class="w-4 h-4"></i>
              Composição da Equipe
            </h3>
            
            <div class="relative">
              <label class="block text-xs text-slate-400 mb-1">Condutor / Piloto da Viatura</label>
              <input
                type="text"
                placeholder="Busque por nome ou matrícula"
                value={condutor}
                onChange={(e) => handleCondutorInput(e.target.value)}
                onFocus={() => setShowCondutorDropdown(true)}
                onBlur={() => setTimeout(() => setShowCondutorDropdown(false), 200)}
                class="glass-input w-full px-4 py-3 rounded-xl text-sm focus:outline-none"
              />
              
              {showCondutorDropdown && filteredCondutores.length > 0 && (
                <div class="absolute z-10 w-full mt-1 bg-slate-900 border border-slate-800 rounded-xl max-h-40 overflow-y-auto shadow-2xl">
                  {filteredCondutores.map(ag => (
                    <button
                      key={ag.matricula}
                      type="button"
                      onClick={() => {
                        setCondutor(ag.nome);
                        setShowCondutorDropdown(false);
                      }}
                      class="w-full text-left px-4 py-3 hover:bg-slate-800 border-b border-slate-800/50 text-sm text-slate-200"
                    >
                      {ag.nome}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div class="relative">
              <label class="block text-xs text-slate-400 mb-1">Integrantes de Patrulha / Passageiros</label>
              <div class="flex gap-2">
                <input
                  type="text"
                  placeholder="Busque por nome ou matrícula para adicionar..."
                  value={novoPatrulheiro}
                  onChange={(e) => handlePatrulheiroInput(e.target.value)}
                  onFocus={() => setShowPatrulheiroDropdown(true)}
                  onBlur={() => setTimeout(() => setShowPatrulheiroDropdown(false), 200)}
                  class="glass-input flex-grow px-3 py-3 rounded-xl text-sm focus:outline-none"
                />
                <button
                  type="button"
                  onClick={handleAddPatrulheiro}
                  class="px-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-white text-sm"
                >
                  + Add
                </button>
              </div>

              {showPatrulheiroDropdown && filteredPatrulheiros.length > 0 && (
                <div class="absolute z-10 w-full mt-1 bg-slate-900 border border-slate-800 rounded-xl max-h-40 overflow-y-auto shadow-2xl">
                  {filteredPatrulheiros.map(ag => (
                    <button
                      key={ag.matricula}
                      type="button"
                      onClick={() => {
                        if (!patrulheiros.includes(ag.nome)) {
                          setPatrulheiros([...patrulheiros, ag.nome]);
                        }
                        setNovoPatrulheiro('');
                        setShowPatrulheiroDropdown(false);
                      }}
                      class="w-full text-left px-4 py-3 hover:bg-slate-800 border-b border-slate-800/50 text-sm text-slate-200"
                    >
                      {ag.nome}
                    </button>
                  ))}
                </div>
              )}

              {patrulheiros.length > 0 && (
                <div class="mt-3 flex flex-wrap gap-2">
                  {patrulheiros.map((p, index) => (
                    <span key={index} class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 text-xs text-slate-200 rounded-full border border-slate-700">
                      {p}
                      <button 
                        type="button" 
                        onClick={() => setPatrulheiros(patrulheiros.filter(x => x !== p))}
                        class="text-slate-400 hover:text-rose-400"
                      >
                        <span><i data-lucide="x" class="w-3.5 h-3.5"></i></span>
                      </button>
                    </span>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
              <i data-lucide="gauge" class="w-4 h-4"></i>
              Status do Veículo
            </h3>
            
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Odômetro Inicial</label>
                <input
                  type="number"
                  placeholder={`Mínimo: ${viatura.odometro_atual} km`}
                  value={odometro}
                  onChange={(e) => setOdometro(e.target.value)}
                  class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold focus:outline-none"
                />
              </div>
              
              <div>
                <label class="block text-xs text-slate-400 mb-1">Combustível</label>
                <select
                  value={combustivel}
                  onChange={(e) => setCombustivel(e.target.value)}
                  class="glass-input w-full px-3 py-3 rounded-xl text-sm font-bold focus:outline-none text-indigo-400"
                >
                  <option value="Reserva">Reserva ⚠️</option>
                  <option value="1/4">1/4</option>
                  <option value="1/2">1/2</option>
                  <option value="3/4">3/4</option>
                  <option value="Cheio">Cheio ⛽</option>
                </select>
              </div>
            </div>
          </div>

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
              <i data-lucide="check-square" class="w-4 h-4"></i>
              Inspeção de Itens Obrigatórios
            </h3>

            <div class="space-y-3">
              {itensChecklist.map(item => (
                <div key={item} class="flex items-center justify-between p-3 bg-navy-900/40 border border-slate-800 rounded-xl">
                  <span class="text-sm text-slate-200">{item}</span>
                  <div class="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setChecklistItens({ ...checklistItens, [item]: true })}
                      class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        checklistItens[item] === true 
                          ? 'bg-emerald-600 text-white' 
                          : 'bg-slate-800 text-slate-500 hover:text-slate-400'
                      }`}
                    >
                      SIM
                    </button>
                    <button
                      type="button"
                      onClick={() => setChecklistItens({ ...checklistItens, [item]: false })}
                      class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                        checklistItens[item] === false 
                          ? 'bg-rose-600 text-white' 
                          : 'bg-slate-800 text-slate-500 hover:text-slate-400'
                      }`}
                    >
                      NÃO
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {(viatura.avarias_ativas || []).length > 0 && (
            <div class="glass-card rounded-2xl p-5 border border-amber-500/20 bg-amber-500/5 space-y-4">
              <h3 class="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                Avarias Pré-existentes
              </h3>
              
              <div class="space-y-3">
                {(viatura.avarias_ativas || []).map((av, idx) => (
                  <div key={idx} class="flex gap-3 p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                    {av.fotoUrl && (
                      <img src={av.fotoUrl} alt="Avaria" class="w-16 h-16 object-cover rounded-lg border border-slate-700 shrink-0" />
                    )}
                    <div>
                      <p class="text-sm text-slate-200 font-semibold">{av.descricao}</p>
                      <p class="text-xs text-slate-500 mt-1">Registrado em: {new Date(av.data_registro).toLocaleDateString('pt-BR')}</p>
                    </div>
                  </div>
                ))}
              </div>

              <label class="flex items-center gap-3 p-3 bg-amber-500/10 rounded-xl border border-amber-500/20 cursor-pointer">
                <input
                  type="checkbox"
                  checked={avariaCiente}
                  onChange={(e) => setAvariaCiente(e.target.checked)}
                  class="w-5 h-5 rounded border-slate-700 text-indigo-600 focus:ring-indigo-600/30"
                />
                <span class="text-xs font-bold text-amber-200">DECLARO CIÊNCIA DAS AVARIAS ACIMA</span>
              </label>
            </div>
          )}

          <div class="glass-card rounded-2xl p-5 border border-slate-800 space-y-4">
            <div class="flex justify-between items-center">
              <h3 class="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                <i data-lucide="shield-alert" class="w-4 h-4 text-amber-500"></i>
                Nova Avaria na Retirada?
              </h3>
              
              <div class="flex gap-2">
                <button
                  type="button"
                  onClick={() => setNovasAvariasPerg(true)}
                  class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                    novasAvariasPerg 
                      ? 'bg-amber-600 text-white' 
                      : 'bg-slate-800 text-slate-500'
                  }`}
                >
                  SIM
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setNovasAvariasPerg(false);
                    setListaNovasAvarias([]);
                    setNovasAvariasDesc('');
                    setNovasAvariasFoto('');
                  }}
                  class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                    !novasAvariasPerg 
                      ? 'bg-slate-700 text-slate-300' 
                      : 'bg-slate-850 text-slate-500'
                  }`}
                >
                  NÃO
                </button>
              </div>
            </div>

            {novasAvariasPerg && (
              <div class="space-y-4 pt-2 border-t border-slate-800/80">
                {listaNovasAvarias.length > 0 && (
                  <div class="space-y-2 mb-3">
                    <label class="block text-2xs font-extrabold uppercase tracking-wider text-slate-400">Avarias Registradas nesta Abertura ({listaNovasAvarias.length})</label>
                    <div class="grid grid-cols-1 gap-2">
                      {listaNovasAvarias.map((av) => (
                        <div key={av.id} class="flex items-center justify-between p-3 bg-slate-900/60 border border-slate-800 rounded-xl gap-3">
                          <div class="flex items-center gap-3">
                            {av.fotoUrl ? (
                              <img src={av.fotoUrl} alt="Nova avaria" class="w-12 h-12 object-cover rounded-lg border border-slate-700 shrink-0" />
                            ) : (
                              <div class="w-12 h-12 rounded-lg bg-slate-800 flex items-center justify-center text-slate-500 shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="2" y1="2" x2="22" y2="22"/><path d="M21 16V6a2 2 0 0 0-2-2H9m-4 0a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11m4-4-4-4-2.828 2.828a2 2 0 0 1-2.828 0L9 13l-3 3"/><circle cx="9" cy="9" r="2"/></svg>
                              </div>
                            )}
                            <p class="text-xs text-slate-250 font-medium line-clamp-2">{av.descricao}</p>
                          </div>
                          <button
                            type="button"
                            onClick={() => handleRemoveAvaria(av.id)}
                            class="p-2 hover:bg-red-950/30 text-red-400 hover:text-red-300 rounded-lg transition-all shrink-0"
                          >
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></svg>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div class="bg-navy-950/30 p-4 border border-slate-850 rounded-xl space-y-4">
                  <label class="block text-xs font-bold text-amber-300/80 uppercase tracking-wider">Nova Avaria</label>
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Descrição da Nova Avaria*</label>
                    <input
                      type="text"
                      placeholder="Ex: Novo arranhão no para-choque..."
                      value={novasAvariasDesc}
                      onChange={(e) => setNovasAvariasDesc(e.target.value)}
                      class="glass-input w-full px-4 py-3 rounded-xl text-sm focus:outline-none border-amber-500/25"
                    />
                  </div>
                  
                  <div>
                    <label class="block text-xs text-slate-400 mb-2">Foto da Nova Avaria</label>
                    <div class="flex items-center gap-3">
                      {novasAvariasFoto ? (
                        <div class="relative w-20 h-20 rounded-xl border border-slate-700 overflow-hidden">
                          <img src={novasAvariasFoto} alt="Nova avaria" class="w-full h-full object-cover" />
                          <button
                            type="button"
                            onClick={() => setNovasAvariasFoto('')}
                            class="absolute top-1 right-1 p-1 bg-red-600 rounded-full text-white"
                          >
                            <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-2.5 h-2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
                          </button>
                        </div>
                      ) : (
                        <>
                          <button
                            type="button"
                            onClick={() => document.getElementById('foto-avaria-camera-input').click()}
                            disabled={loadingFotoAvaria}
                            class="w-24 h-20 bg-indigo-950/20 hover:bg-indigo-900/20 border border-dashed border-indigo-500/30 rounded-xl flex flex-col items-center justify-center text-indigo-400 gap-1 disabled:opacity-55 btn-tactile"
                          >
                            {loadingFotoAvaria ? (
                              <div class="w-5 h-5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                            ) : (
                              <>
                                <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
                                <span class="text-[9px] uppercase font-bold">Câmera</span>
                              </>
                            )}
                          </button>
                          <input
                            id="foto-avaria-camera-input"
                            type="file"
                            accept="image/*"
                            capture="environment"
                            onChange={(e) => {
                              if (e.target.files[0]) handleFotoAvaria(e.target.files[0]);
                            }}
                            class="hidden"
                          />

                          <button
                            type="button"
                            onClick={() => document.getElementById('foto-avaria-galeria-input').click()}
                            disabled={loadingFotoAvaria}
                            class="w-24 h-20 bg-slate-850 hover:bg-slate-800 border border-dashed border-slate-700 rounded-xl flex flex-col items-center justify-center text-slate-400 gap-1 disabled:opacity-55 btn-tactile"
                          >
                            {loadingFotoAvaria ? (
                              <div class="w-5 h-5 border-2 border-slate-400 border-t-transparent rounded-full animate-spin"></div>
                            ) : (
                              <>
                                <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></span>
                                <span class="text-[9px] uppercase font-bold">Galeria</span>
                              </>
                            )}
                          </button>
                          <input
                            id="foto-avaria-galeria-input"
                            type="file"
                            accept="image/*"
                            onChange={(e) => {
                              if (e.target.files[0]) handleFotoAvaria(e.target.files[0]);
                            }}
                            class="hidden"
                          />
                        </>
                      )}
                    </div>
                  </div>

                  <div class="flex justify-end pt-2">
                    <button
                      type="button"
                      onClick={handleAddAvaria}
                      disabled={!novasAvariasDesc.trim() || loadingFotoAvaria}
                      class="px-4 py-2.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 disabled:opacity-40 disabled:pointer-events-none rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 btn-tactile"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

                  </div>
                </div>
              </div>
            )}
          </div>

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
              <i data-lucide="package" class="w-4 h-4"></i>
              Carregar Materiais Operacionais
            </h3>
            <p class="text-xs text-slate-400 -mt-2">Esses itens serão debitados automaticamente do estoque central.</p>

            <div class="space-y-3">
              {listaMateriais.map(mat => (
                <div key={mat.id} class="flex items-center justify-between p-3.5 bg-navy-900/40 border border-slate-800 rounded-xl">
                  <div>
                    <h4 class="text-sm font-semibold text-slate-200">{mat.nome}</h4>
                    <p class="text-xs text-slate-500">Pátio Central: {mat.quantidade_patio} unid.</p>
                  </div>
                  
                  <div class="flex items-center gap-3">
                    <button
                      type="button"
                      onClick={() => handleCargaAlteracao(mat.id, -1)}
                      class="w-8 h-8 flex items-center justify-center bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-slate-300 rounded-lg text-lg font-bold transition-all"
                    >
                      -
                    </button>
                    <span class="w-8 text-center text-lg font-bold font-outfit text-white">
                      {cargaInicial[mat.id] || 0}
                    </span>
                    <button
                      type="button"
                      onClick={() => handleCargaAlteracao(mat.id, 1)}
                      class="w-8 h-8 flex items-center justify-center bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-slate-300 rounded-lg text-lg font-bold transition-all"
                    >

                  onChange={(e) => setOutroNome(e.target.value)}
