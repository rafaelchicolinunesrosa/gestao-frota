                />
                <input
                  type="number"
                  placeholder="Qtd"
                  min="1"
                  value={outroQtd}
                  onChange={(e) => setOutroQtd(e.target.value)}
                  class="glass-input w-20 px-2 py-2.5 rounded-xl text-xs text-center focus:outline-none"
                />
                <button
                  type="button"
                  onClick={handleAddOutroMaterial}
                  disabled={adicionandoMaterial}
                  class="px-4 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 rounded-xl font-bold text-white text-xs whitespace-nowrap btn-tactile flex items-center justify-center"
                >
                  {adicionandoMaterial ? '...' : '+ Add'}
                </button>
              </div>
            </div>
          </div>

          <div class="glass-card rounded-2xl p-5 border border-slate-800 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
              <i data-lucide="edit-3" class="w-4 h-4"></i>
              Observações Gerais de Entrada
            </h3>
            <textarea
              placeholder="Digite alguma observação sobre o estado do veículo ou equipe se achar necessário..."
              value={observacoes}
              onChange={(e) => setObservacoes(e.target.value)}
              class="glass-input w-full px-4 py-3 rounded-xl text-sm focus:outline-none h-20 resize-none"
            ></textarea>
          </div>

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
              <i data-lucide="camera" class="w-4 h-4"></i>
              Fotos Obrigatórias da Abertura
            </h3>
            <p class="text-xs text-slate-400 -mt-2">Tire pelo menos 1 foto nítida do veículo.</p>

            <div class="grid grid-cols-3 gap-3">
              {fotos.map((url, i) => (
                <div key={i} class="relative w-full h-24 rounded-xl border border-slate-800 overflow-hidden">
                  <img src={url} alt="Abertura" class="w-full h-full object-cover" />
                  <button
                    type="button"
                    onClick={() => setFotos(fotos.filter((_, idx) => idx !== i))}
                    class="absolute top-1 right-1 p-1 bg-red-600 rounded-full text-white text-xs"
                  >
                    <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
                  </button>
                </div>
              ))}
              
              <div class="grid grid-cols-2 gap-3 w-full">
                <button
                  type="button"
                  onClick={() => document.getElementById('foto-abertura-camera-input').click()}
                  disabled={loadingFotoAbertura}
                  class="h-24 bg-indigo-950/20 hover:bg-indigo-900/20 text-indigo-400 border border-dashed border-indigo-500/30 rounded-xl flex flex-col items-center justify-center gap-1 transition-all disabled:opacity-55 btn-tactile"
                >
                  {loadingFotoAbertura ? (
                    <div class="w-6 h-6 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                      <span class="text-2xs font-semibold uppercase tracking-wider">Câmera</span>
                    </>
                  )}
                </button>
                <input
                  id="foto-abertura-camera-input"
                  type="file"
                  accept="image/*"
                  capture="environment"
                  onChange={(e) => {
                    if (e.target.files[0]) handleFotoUpload(e.target.files[0]);
                  }}
                  class="hidden"
                />

                <button
                  type="button"
                  onClick={() => document.getElementById('foto-abertura-galeria-input').click()}
                  disabled={loadingFotoAbertura}
                  class="h-24 bg-slate-800/40 hover:bg-slate-800 text-slate-400 border border-dashed border-slate-700 hover:border-slate-500 rounded-xl flex flex-col items-center justify-center gap-1 transition-all disabled:opacity-55 btn-tactile"
                >
                  {loadingFotoAbertura ? (
                    <div class="w-6 h-6 border-2 border-slate-400 border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                      <span class="text-2xs font-semibold uppercase tracking-wider">Galeria</span>
                    </>
                  )}
                </button>
                <input
                  id="foto-abertura-galeria-input"
                  type="file"
                  accept="image/*"
                  onChange={(e) => {
                    if (e.target.files[0]) handleFotoUpload(e.target.files[0]);
                  }}
                  class="hidden"
                />
              </div>
            </div>
          </div>

          <button
            type="button"
            onClick={handleConfirmarAbertura}
            disabled={salvando}
            class="btn-tactile w-full py-4.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white rounded-2xl text-base font-bold transition-all shadow-lg shadow-emerald-600/20 disabled:opacity-50"
          >
            {salvando ? (
              <div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin mx-auto"></div>
            ) : (
              'CONFIRMAR CHECK-IN & ABRIR SERVIÇO'
            )}
          </button>
        </div>
      );
    }

    // ==========================================
    // TELA C: SERVIÇO (MODO DE PLANTÃO - 100% TEMPO REAL)
    // ==========================================
    function ScreenServico({ prefixo, viatura, checklist, listaMateriais, listaAgentes, setScreen }) {
      const [modalEquipe, setModalEquipe] = useState(false);
      const [modalMovimento, setModalMovimento] = useState(false);
      const [movTipo, setMovTipo] = useState(null);
      
      const [equipeEdit, setEquipeEdit] = useState([]);
      const [novoIntegranteEdit, setNovoIntegranteEdit] = useState('');
      const [showIntegranteDropdown, setShowIntegranteDropdown] = useState(false);
      const [filteredIntegrantes, setFilteredIntegrantes] = useState([]);

      const [movMaterialId, setMovMaterialId] = useState('');
      const [movQuantidade, setMovQuantidade] = useState(1);
      const [movOutroMaterialText, setMovOutroMaterialText] = useState('');
      const [movFoto, setMovFoto] = useState('');
      const [movObservacao, setMovObservacao] = useState('');
      const [loadingFotoMovimento, setLoadingFotoMovimento] = useState(false);

      const [gpsStatus, setGpsStatus] = useState('ocioso');
      const [gpsCoords, setGpsCoords] = useState(null);
      const [enderecoManual, setEnderecoManual] = useState('');
      const [gpsCountdown, setGpsCountdown] = useState(5);
      const timerRef = useRef(null);

      // Logística Inteligente por Lote
      const [lotesAtivos, setLotesAtivos] = useState([]);
      const [selectedLoteId, setSelectedLoteId] = useState('');
      const [selectedLoteChecklistId, setSelectedLoteChecklistId] = useState('');
      const [movNaoEncontrado, setMovNaoEncontrado] = useState(false);

      useEffect(() => {
        if (!listenTodosChecklists) return;
        const unsub = listenTodosChecklists((data) => {
          const active = data.flatMap(c => {
            return (c.movimentacoes || [])
              .filter(m => m.tipo === 'deixei_via' && m.quantidade_restante > 0)
              .map(m => ({
                ...m,
                viatura_id: c.viatura_id,
                checklist_id: c.id,
                agente_nome: c.abertura?.equipe?.[0]?.nome || 'Desconhecido'
              }));
          });
          setLotesAtivos(active);
        });
        return () => unsub();
      }, []);

      useEffect(() => {
        if (checklist.abertura && checklist.abertura.equipe) {
          setEquipeEdit(checklist.abertura.equipe);
        }
      }, [checklist]);

      const closeMovimentoModal = () => {
        setModalMovimento(false);
        setMovTipo(null);
        setMovMaterialId('');
        setMovQuantidade(1);
        setMovOutroMaterialText('');
        setGpsStatus('ocioso');
        setGpsCoords(null);
        setEnderecoManual('');
        setSelectedLoteId('');
        setSelectedLoteChecklistId('');
        setMovNaoEncontrado(false);
        setMovFoto('');
        setMovObservacao('');
        setLoadingFotoMovimento(false);
        clearInterval(timerRef.current);
      };

      const iniciarRastreamentoGPS = () => {
        setGpsStatus('buscando');
        setGpsCoords(null);
        setGpsCountdown(10);

        if (timerRef.current) clearInterval(timerRef.current);

        timerRef.current = setInterval(() => {
          setGpsCountdown(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        const buscarEnderecoReverso = (lat, lng) => {
          fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
            headers: { 
              'Accept-Language': 'pt-BR',
              'User-Agent': 'GestaoFrota/1.0'
            }
          })
            .then(res => res.json())
            .then(data => {
              if (data && data.display_name) {
                const addr = data.address;
                let compactAddr = '';
                if (addr.road) {
                  compactAddr = addr.road;
                  if (addr.house_number) compactAddr += `, nº ${addr.house_number}`;
                  if (addr.suburb) compactAddr += ` - ${addr.suburb}`;
                } else {
                  compactAddr = data.display_name;
                }
                setEnderecoManual(compactAddr);
              } else {
                setEnderecoManual(`Coordenadas: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
              }
            })
            .catch(() => {
              setEnderecoManual(`Coordenadas: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
            });
        };

        const dispararFallbackSimulado = () => {
          clearInterval(timerRef.current);
          setGpsStatus('sucesso');
          const lat = -23.55052 + (Math.random() - 0.5) * 0.01;
          const lng = -46.633308 + (Math.random() - 0.5) * 0.01;
          setGpsCoords({ latitude: lat, longitude: lng });
          buscarEnderecoReverso(lat, lng);
        };

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              clearInterval(timerRef.current);
              setGpsStatus('sucesso');
              const lat = position.coords.latitude;
              const lng = position.coords.longitude;
              setGpsCoords({ latitude: lat, longitude: lng });
              buscarEnderecoReverso(lat, lng);
            },
            (error) => {
              console.warn("⚠️ Falha ao obter GPS Real:", error.message);
              if (isDemoMode) {
                dispararFallbackSimulado();
              } else {
                clearInterval(timerRef.current);
                setGpsStatus('falha');
                alert("Não foi possível acessar a localização do dispositivo. Ative o GPS nas configurações e conceda a permissão ao aplicativo, ou digite o endereço/referência manualmente.");
              }
            },
            {
              enableHighAccuracy: true,
              timeout: 9000,
              maximumAge: 0
            }
          );
        } else {
          console.warn("⚠️ Geolocation API não suportada.");
          if (isDemoMode) {
            dispararFallbackSimulado();
          } else {
            clearInterval(timerRef.current);
            setGpsStatus('falha');
            alert("Seu navegador não suporta geolocalização. Por favor, digite o endereço manualmente.");
          }
        }
      };

      const handleFotoMovimento = async (file) => {
        if (!file) return;
        setLoadingFotoMovimento(true);
        try {
          const url = await uploadFoto(file);
          setMovFoto(url);
        } catch (err) {
          alert('Erro ao carregar a foto: ' + err.message);
        } finally {
          setLoadingFotoMovimento(false);
        }
      };

      const handleMovimentoBotao = (tipo) => {
        setMovTipo(tipo);
        setModalMovimento(true);
        
        if (listaMateriais.length > 0) {
          setMovMaterialId(listaMateriais[0].id);
        }

        if (tipo === 'deixei_via' || tipo === 'recolhi_via') {
          iniciarRastreamentoGPS();
        }
      };

      const handleConfirmarMovimentacao = async () => {
        if (!movMaterialId) return;

        if ((movTipo === 'deixei_via' || movTipo === 'recolhi_via') && gpsStatus === 'falha' && !enderecoManual.trim()) {
          alert('Por favor, informe o endereço manual ou ponto de referência.');
          return;
        }

        if (movMaterialId === 'outro' && !movOutroMaterialText.trim()) {
          alert('Por favor, digite o nome do material não listado.');
          return;
        }

        if (movTipo === 'recolhi_via' && movNaoEncontrado && (!selectedLoteId || selectedLoteId === 'outro')) {
          alert('Para marcar como não encontrado, por favor selecione um lote ativo de rua listado na caixa de seleção.');
          return;
        }

        const movimentoData = {
          tipo: movTipo,
          material_id: movMaterialId,
          quantidade: parseInt(movQuantidade),
          outro_material: movMaterialId === 'outro' ? movOutroMaterialText : null,
          gps: gpsCoords,
          endereco: enderecoManual.trim() ? enderecoManual.trim() : (gpsStatus === 'sucesso' && gpsCoords ? `Coordenadas: ${gpsCoords.latitude.toFixed(6)}, ${gpsCoords.longitude.toFixed(6)}` : 'Sem endereço informado'),
          referencia_mov_id: (movTipo === 'recolhi_via' && selectedLoteId && selectedLoteId !== 'outro') ? selectedLoteId : null,
          referencia_checklist_id: (movTipo === 'recolhi_via' && selectedLoteId && selectedLoteId !== 'outro') ? selectedLoteChecklistId : null,
          nao_listado: movTipo === 'recolhi_via' && (selectedLoteId === 'outro' || !selectedLoteId),
          nao_encontrado: movTipo === 'recolhi_via' && movNaoEncontrado,
          foto_url: (movTipo === 'deixei_via' && movFoto) ? movFoto : null,
          observacao: (movTipo === 'deixei_via' || movTipo === 'recolhi_via') && movObservacao.trim() ? movObservacao.trim() : null
        };

        try {
          await registrarMovimentacao(prefixo, checklist.id, movimentoData);
          closeMovimentoModal();
        } catch (err) {
          alert('Erro ao sincronizar movimentação. Verifique a rede.');
        }
      };

      const handleIntegranteInput = (val) => {
        setNovoIntegranteEdit(val);
        if (val.trim() === '') {
          setFilteredIntegrantes([]);
          setShowIntegranteDropdown(false);
        } else {
          const matched = listaAgentes.filter(ag => 
            (ag.nome.toLowerCase().includes(val.toLowerCase()) || 
             ag.matricula.includes(val)) &&
            !equipeEdit.some(p => p.nome === ag.nome)
          );
          setFilteredIntegrantes(matched);
          setShowIntegranteDropdown(true);
        }
      };

      const addIntegranteLocal = () => {
        if (!novoIntegranteEdit.trim()) return;
        const ag = listaAgentes.find(a => a.nome === novoIntegranteEdit);
        const formatado = {
          nome: ag ? ag.nome : novoIntegranteEdit,
          matricula: ag ? ag.matricula : 'N/A',
          papel: 'Patrulheiro'
        };

        if (!equipeEdit.some(x => x.nome.trim().toLowerCase() === formatado.nome.trim().toLowerCase())) {
          setEquipeEdit([...equipeEdit, formatado]);
        }
        setNovoIntegranteEdit('');
        setFilteredIntegrantes([]);
        setShowIntegranteDropdown(false);
      };

      const salvarNovaEquipe = async () => {
        try {
          await alterarIntegrantes(prefixo, checklist.id, equipeEdit);
          setModalEquipe(false);
        } catch (err) {
          alert('Erro ao atualizar equipe no banco.');
        }
      };

      useEffect(() => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }, [modalEquipe, modalMovimento, gpsStatus]);

      return (
        <div class="space-y-6">
          
          <div class="glass-card rounded-3xl p-5 border border-indigo-500/25 bg-gradient-to-br from-indigo-950/40 to-slate-900/60 shadow-xl space-y-4">
            
            <div class="flex justify-between items-start">
              <div>
                <span class="inline-flex px-2.5 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-2xs font-extrabold tracking-wider rounded-full uppercase animate-pulse">
                  Plantão Ativo
                </span>
                <h2 class="text-3xl font-black font-outfit text-white tracking-wide mt-1.5">{prefixo}</h2>
              </div>
              <button
                onClick={() => setModalEquipe(true)}
                class="btn-tactile px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/60 rounded-xl text-xs font-bold flex items-center gap-1.5"
              >
                <i data-lucide="users" class="w-4 h-4 text-indigo-400"></i>
                <span>Equipe</span>
              </button>
            </div>

            <div class="border-t border-slate-800/80 pt-3 flex flex-col gap-1.5">
              <span class="text-2xs font-bold text-slate-500 uppercase tracking-widest block">Equipe de Serviço</span>
              <div class="flex flex-col gap-1">
                {checklist.abertura && (checklist.abertura.equipe || []).map((p, i) => (
                  <div key={i} class="flex items-center gap-2 text-sm text-slate-200">
                    <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                    <span class="font-semibold">{p.nome}</span>
                    <span class="text-xs text-slate-400">({p.papel})</span>
                  </div>
                ))}
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4 border-t border-slate-800/80 pt-3">
              <div>
                <span class="text-2xs font-semibold text-slate-400 uppercase tracking-wider block">Km Inicial</span>
                <span class="text-base font-extrabold text-slate-200 font-outfit">{checklist.abertura?.odometro} km</span>
              </div>
              <div>
                <span class="text-2xs font-semibold text-slate-400 uppercase tracking-wider block">Combustível</span>
                <span class="text-base font-extrabold text-slate-200 font-outfit">{checklist.abertura?.combustivel}</span>
              </div>
            </div>

          </div>

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
              <i data-lucide="archive" class="w-4 h-4 text-slate-400"></i>
              Saldo de Carga na Viatura
            </h3>

            <div class="grid grid-cols-3 gap-3">
              {listaMateriais.map(mat => {
                const totalVtr = viatura.carga_atual?.[mat.id] || 0;
                return (
                  <div key={mat.id} class="p-3 bg-navy-900/50 rounded-xl border border-slate-800 flex flex-col items-center justify-between text-center min-h-[90px]">
                    <span class="text-2xs font-medium text-slate-400 line-clamp-1">{mat.nome}</span>
                    <span class="text-3xl font-black font-outfit text-white mt-1">
                      {totalVtr}
                    </span>
                    <span class="text-2xs text-slate-500 mt-0.5">VTR</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div class="glass-card rounded-3xl p-5 space-y-4 border border-indigo-500/10">
            <div class="text-center mb-1">
              <h3 class="text-base font-bold font-outfit text-white">Logística de Cargas</h3>
              <p class="text-xs text-slate-400">Ações rápidas na rua ou no pátio</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <button
                onClick={() => handleMovimentoBotao('deixei_via')}
                class="btn-tactile py-4.5 bg-slate-900 border border-indigo-500/20 text-indigo-300 font-bold rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-850 active:bg-slate-950 transition-all shadow-md"
              >
                <i data-lucide="map-pin" class="w-7 h-7 text-indigo-400 animate-bounce"></i>
                <span class="text-xs uppercase tracking-wide">Deixei na Via</span>
              </button>
              
              <button
                onClick={() => handleMovimentoBotao('recolhi_via')}
                class="btn-tactile py-4.5 bg-slate-900 border border-indigo-500/20 text-indigo-300 font-bold rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-850 active:bg-slate-950 transition-all shadow-md"
              >
                <i data-lucide="navigation" class="w-7 h-7 text-indigo-400"></i>
                <span class="text-xs uppercase tracking-wide">Recolhi da Via</span>
              </button>

              <button
                onClick={() => handleMovimentoBotao('peguei_base')}
                class="btn-tactile py-4.5 bg-[#0b2b1b] border border-emerald-500/20 text-emerald-300 font-bold rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-emerald-950 active:bg-emerald-900 transition-all shadow-md"
              >
                <i data-lucide="plus-square" class="w-7 h-7 text-emerald-400"></i>
                <span class="text-xs uppercase tracking-wide">Peguei da Base</span>
              </button>
              
              <button
                onClick={() => handleMovimentoBotao('devolvi_base')}
                class="btn-tactile py-4.5 bg-[#2d1218] border border-rose-500/20 text-rose-300 font-bold rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-rose-950 active:bg-rose-900 transition-all shadow-md"
              >
                <i data-lucide="minus-square" class="w-7 h-7 text-rose-400"></i>
                <span class="text-xs uppercase tracking-wide">Devolvi à Base</span>
              </button>
            </div>
          </div>

          <button
            onClick={() => setScreen('encerramento')}
            class="btn-tactile w-full py-4 bg-rose-600/90 hover:bg-rose-500 active:bg-rose-700 text-white rounded-2xl text-base font-bold transition-all flex items-center justify-center gap-2 shadow-lg shadow-rose-600/15"
          >
            <i data-lucide="power" class="w-5 h-5"></i>
            <span>ENCERRAR PLANTÃO ATUAL</span>
          </button>

          {/* MODAL EQUIPE */}

                            class="hidden"

    function ScreenEncerramento({ prefixo, viatura, checklist, listaMateriais, voltar, finalizar }) {
      const [odometroFinal, setOdometroFinal] = useState('');
      const [combustivelFinal, setCombustivelFinal] = useState('1/2');
      const [cargaFisicaReal, setCargaFisicaReal] = useState({});
      const [justificativaDivergencia, setJustificativaDivergencia] = useState('');
      const [novasAvariasPerg, setNovasAvariasPerg] = useState(false);
      const [novasAvariasDesc, setNovasAvariasDesc] = useState('');
      const [novasAvariasFoto, setNovasAvariasFoto] = useState('');
      const [listaNovasAvarias, setListaNovasAvarias] = useState([]);
      const [fotosFechamento, setFotosFechamento] = useState([]);
      const [erro, setErro] = useState('');
      const [salvando, setSalvando] = useState(false);
      const [observacoesFechamento, setObservacoesFechamento] = useState('');

      const minOdo = viatura.odometro_atual || checklist.abertura.odometro;

      useEffect(() => {
        const cargaReal = {};
        listaMateriais.forEach(mat => {
          cargaReal[mat.id] = viatura.carga_atual?.[mat.id] || 0;
        });
        setCargaFisicaReal(cargaReal);
      }, [listaMateriais, viatura]);

      useEffect(() => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }, [listaNovasAvarias, novasAvariasPerg, novasAvariasFoto]);

      const temDivergencia = () => {
        let divergência = false;
        listaMateriais.forEach(mat => {
          const esperado = viatura.carga_atual?.[mat.id] || 0;
          const real = cargaFisicaReal[mat.id] || 0;
          if (esperado !== real) divergência = true;
        });
        return divergência;
      };

      const handleCargaFisicaChange = (id, change) => {
        setCargaFisicaReal(prev => ({
          ...prev,
          [id]: Math.max(0, (prev[id] || 0) + change)
        }));
      };

      const [loadingFotoFechamento, setLoadingFotoFechamento] = useState(false);
      const [loadingFotoAvaria, setLoadingFotoAvaria] = useState(false);

      const handleAddFotoFechamento = async (file) => {
        if (!file) return;
        setLoadingFotoFechamento(true);
        try {
          const url = await uploadFoto(file);
          setFotosFechamento(prev => [...prev, url]);
        } catch (err) {
          alert('Erro ao carregar a foto de encerramento: ' + err.message);
        } finally {
          setLoadingFotoFechamento(false);
        }
      };

      const handleFotoAvaria = async (file) => {
        if (!file) return;
        setLoadingFotoAvaria(true);
        try {
          const url = await uploadFoto(file);
          setNovasAvariasFoto(url);
        } catch (err) {
          alert('Erro ao carregar a foto de avaria: ' + err.message);
        } finally {
          setLoadingFotoAvaria(false);
        }
      };

      const handleAddAvaria = () => {
        if (!novasAvariasDesc.trim()) {
          alert('Por favor, digite a descrição da avaria.');
          return;
        }
        const nova = {
          id: 'AV_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          descricao: novasAvariasDesc.trim(),
          fotoUrl: novasAvariasFoto,
          data_registro: new Date().toISOString()
        };
        setListaNovasAvarias(prev => [...prev, nova]);
        setNovasAvariasDesc('');
        setNovasAvariasFoto('');
      };

      const handleRemoveAvaria = (id) => {
        setListaNovasAvarias(prev => prev.filter(av => av.id !== id));
      };

      const handleEncerrarPlantao = async () => {
        setErro('');

        if (!odometroFinal || isNaN(odometroFinal)) {
          setErro('Informe o odômetro final em número.');
          window.scrollTo(0, 0);
          return;
        }

        if (parseInt(odometroFinal) < minOdo) {
          setErro(`Odômetro menor que o registrado na abertura (${minOdo} km).`);
          window.scrollTo(0, 0);
          return;
        }

        if (temDivergencia() && !justificativaDivergencia.trim()) {
          setErro('Divergência detectada no estoque. Descreva uma justificativa obrigatoriamente.');
          return;
        }

        if (fotosFechamento.length < 1) {
          setErro('É exigida pelo menos 1 foto obrigatória de fechamento.');
          return;
        }

        if (novasAvariasPerg && listaNovasAvarias.length === 0 && !novasAvariasDesc.trim()) {
          setErro('Por favor, informe a descrição detalhada de pelo menos uma nova avaria.');
          return;
        }

        setSalvando(true);

        let avariasParaEnviar = [...listaNovasAvarias];
        if (novasAvariasPerg && novasAvariasDesc.trim()) {
          avariasParaEnviar.push({
            descricao: novasAvariasDesc.trim(),
            fotoUrl: novasAvariasFoto,
            data_registro: new Date().toISOString()
          });
        }

        const checklistFechadoData = {
          odometro_final: parseInt(odometroFinal),
          combustivel_final: combustivelFinal,
          fotos: fotosFechamento,
          carga_final_real: cargaFisicaReal,
          carga_final_esperada: viatura.carga_atual || {},
          divergencia_justificativa: temDivergencia() ? justificativaDivergencia : null,
          observacoes: observacoesFechamento,
          novas_avarias: novasAvariasPerg ? avariasParaEnviar.map(av => ({
            descricao: av.descricao,
            fotoUrl: av.fotoUrl || '',
            data_registro: av.data_registro || new Date().toISOString()
          })) : []
        };

        try {
          await fecharChecklist(prefixo, checklist.id, checklistFechadoData);
          finalizar();
        } catch (err) {
          setErro('Erro ao salvar encerramento no banco. Verifique a rede.');
        } finally {
          setSalvando(false);
        }
      };

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <button onClick={voltar} class="p-2 bg-slate-800/40 rounded-xl text-slate-400 hover:text-white">
              <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <div class="text-right">
              <h2 class="text-2xl font-bold font-outfit text-white">{prefixo}</h2>
              <p class="text-xs text-slate-400">Check-out de Fechamento</p>
            </div>
          </div>

          {erro && (
            <div class="p-4 bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm rounded-xl flex items-start gap-2">
              <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 mt-0.5"></i>
              <span>{erro}</span>
            </div>
          )}

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-rose-400 flex items-center gap-2">
              <i data-lucide="gauge" class="w-4 h-4"></i>
              Métricas Finais do Veículo
            </h3>
            
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Odômetro Final</label>
                <input
                  type="number"
                  placeholder={`Mínimo: ${minOdo} km`}
                  value={odometroFinal}
                  onChange={(e) => setOdometroFinal(e.target.value)}
                  class="glass-input w-full px-4 py-3 rounded-xl text-sm font-bold focus:outline-none"
                />
              </div>
              
              <div>
                <label class="block text-xs text-slate-400 mb-1">Nível de Combustível</label>
                <select
                  value={combustivelFinal}
                  onChange={(e) => setCombustivelFinal(e.target.value)}
                  class="glass-input w-full px-3 py-3 rounded-xl text-sm font-bold focus:outline-none text-rose-400"
                >
                  <option value="Reserva">Reserva ⚠️</option>
                  <option value="1/4">1/4</option>
                  <option value="1/2">1/2</option>
                  <option value="3/4">3/4</option>
                  <option value="Cheio">Cheio ⛽</option>
                </select>
              </div>
            </div>
          </div>

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-rose-400 flex items-center gap-2">
              <i data-lucide="clipboard" class="w-4 h-4"></i>
              Conferência Física de Carga
            </h3>
            <p class="text-xs text-slate-400 -mt-2">Conte fisicamente os materiais na viatura.</p>

            <div class="space-y-3">
              {listaMateriais.map(mat => {
                const esperado = viatura.carga_atual?.[mat.id] || 0;
                const real = cargaFisicaReal[mat.id] || 0;
                const dif = real - esperado;

                return (
                  <div key={mat.id} class="p-3 bg-navy-900/40 border border-slate-800 rounded-xl flex items-center justify-between">
                    <div>
                      <h4 class="text-sm font-semibold text-slate-200">{mat.nome}</h4>
                      <div class="flex items-center gap-2 mt-0.5">
                        <span class="text-2xs text-slate-500">Teórico Esperado: {esperado}</span>
                        {dif !== 0 && (
                          <span class={`text-2xs px-1.5 py-0.5 rounded font-extrabold ${dif > 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                            {dif > 0 ? `+${dif}` : dif}
                          </span>
                        )}
                      </div>
                    </div>

                    <div class="flex items-center gap-3">
                      <button
                        type="button"
                        onClick={() => handleCargaFisicaChange(mat.id, -1)}
                        class="w-8 h-8 flex items-center justify-center bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-slate-300 rounded-lg text-lg font-bold transition-all"
                      >
                        -
                      </button>
                      <span class="w-6 text-center text-base font-bold font-outfit text-white">
                        {real}
                      </span>
                      <button
                        type="button"
                        onClick={() => handleCargaFisicaChange(mat.id, 1)}
                        class="w-8 h-8 flex items-center justify-center bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-slate-300 rounded-lg text-lg font-bold transition-all"
                      >
                        +
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            {temDivergencia() && (
              <div class="space-y-2 border-t border-slate-800/80 pt-3">
                <label class="block text-xs font-bold text-amber-400">⚠️ Justificativa de Divergência de Estoque*</label>
                <textarea
                  placeholder="Explique o motivo do saldo físico divergir do saldo teórico esperado..."
                  value={justificativaDivergencia}
                  onChange={(e) => setJustificativaDivergencia(e.target.value)}
                  class="glass-input w-full p-3 rounded-xl text-xs focus:outline-none h-20 text-slate-200 border-amber-500/25"
                />
              </div>
            )}
          </div>

          <div class="glass-card rounded-2xl p-5 border border-amber-500/10 bg-amber-500/2 space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                <i data-lucide="shield-alert" class="w-4 h-4"></i>
                Houve Novas Avarias/Batidas?
              </h3>
              
              <div class="flex gap-2">
                <button
                  type="button"
                  onClick={() => setNovasAvariasPerg(true)}
                  class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                    novasAvariasPerg 
                      ? 'bg-amber-600 text-white' 
                      : 'bg-slate-800 text-slate-500'
                  }`}
                >
                  SIM
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setNovasAvariasPerg(false);
                    setListaNovasAvarias([]);
                    setNovasAvariasDesc('');
                    setNovasAvariasFoto('');
                  }}
                  class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                    !novasAvariasPerg 
                      ? 'bg-slate-700 text-slate-300' 
                      : 'bg-slate-850 text-slate-500'
                  }`}
                >
                  NÃO
                </button>
              </div>
            </div>

            {novasAvariasPerg && (
              <div class="space-y-4 pt-2 border-t border-slate-800/80">
                {listaNovasAvarias.length > 0 && (
                  <div class="space-y-2 mb-3">
                    <label class="block text-2xs font-extrabold uppercase tracking-wider text-slate-400">Avarias Registradas neste Fechamento ({listaNovasAvarias.length})</label>
                    <div class="grid grid-cols-1 gap-2">
                      {listaNovasAvarias.map((av) => (
                        <div key={av.id} class="flex items-center justify-between p-3 bg-slate-900/60 border border-slate-800 rounded-xl gap-3">
                          <div class="flex items-center gap-3">
                            {av.fotoUrl ? (
                              <img src={av.fotoUrl} alt="Nova avaria" class="w-12 h-12 object-cover rounded-lg border border-slate-700 shrink-0" />
                            ) : (
                              <div class="w-12 h-12 rounded-lg bg-slate-800 flex items-center justify-center text-slate-500 shrink-0">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="2" y1="2" x2="22" y2="22"/><path d="M21 16V6a2 2 0 0 0-2-2H9m-4 0a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11m4-4-4-4-2.828 2.828a2 2 0 0 1-2.828 0L9 13l-3 3"/><circle cx="9" cy="9" r="2"/></svg>
                              </div>
                            )}
                            <p class="text-xs text-slate-250 font-medium line-clamp-2">{av.descricao}</p>
                          </div>
                          <button
                            type="button"
                            onClick={() => handleRemoveAvaria(av.id)}
                            class="p-2 hover:bg-red-950/30 text-red-400 hover:text-red-300 rounded-lg transition-all shrink-0"
                          >
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></svg>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div class="bg-navy-950/30 p-4 border border-slate-850 rounded-xl space-y-4">
                  <label class="block text-xs font-bold text-amber-300/80 uppercase tracking-wider">Nova Avaria</label>
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Descrição do Ocorrido/Avaria*</label>
                    <input
                      type="text"
                      placeholder="Ex: Pequeno amassado no para-choque dianteiro..."
                      value={novasAvariasDesc}
                      onChange={(e) => setNovasAvariasDesc(e.target.value)}
                      class="glass-input w-full px-4 py-3 rounded-xl text-sm focus:outline-none border-amber-500/25"
                    />
                  </div>
                  
                  <div>
                    <label class="block text-xs text-slate-400 mb-2">Foto da Nova Avaria</label>
                    <div class="flex items-center gap-3">
                      {novasAvariasFoto ? (
                        <div class="relative w-20 h-20 rounded-xl border border-slate-700 overflow-hidden">
                          <img src={novasAvariasFoto} alt="Nova avaria" class="w-full h-full object-cover" />
                          <button
                            type="button"
                            onClick={() => setNovasAvariasFoto('')}
                            class="absolute top-1 right-1 p-1 bg-red-600 rounded-full text-white"
                          >
                            <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-2.5 h-2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
                          </button>
                        </div>
                      ) : (
                        <>
                          <button
                            type="button"
                            onClick={() => document.getElementById('foto-avaria-fechamento-camera-input').click()}
                            disabled={loadingFotoAvaria}
                            class="w-24 h-20 bg-indigo-950/20 hover:bg-indigo-900/20 border border-dashed border-indigo-500/30 rounded-xl flex flex-col items-center justify-center text-indigo-400 gap-1 disabled:opacity-55 btn-tactile"
                          >
                            {loadingFotoAvaria ? (
                              <div class="w-5 h-5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
                            ) : (
                              <>
                                <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
                                <span class="text-[9px] uppercase font-bold">Câmera</span>
                              </>
                            )}
                          </button>
                          <input
                            id="foto-avaria-fechamento-camera-input"
                            type="file"
                            accept="image/*"
                            capture="environment"
                            onChange={(e) => {
                              if (e.target.files[0]) handleFotoAvaria(e.target.files[0]);
                            }}
                            class="hidden"
                          />

                          <button
                            type="button"
                            onClick={() => document.getElementById('foto-avaria-fechamento-galeria-input').click()}
                            disabled={loadingFotoAvaria}
                            class="w-24 h-20 bg-slate-850 hover:bg-slate-800 border border-dashed border-slate-700 rounded-xl flex flex-col items-center justify-center text-slate-400 gap-1 disabled:opacity-55 btn-tactile"
                          >
                            {loadingFotoAvaria ? (
                              <div class="w-5 h-5 border-2 border-slate-400 border-t-transparent rounded-full animate-spin"></div>
                            ) : (
                              <>
                                <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></span>
                                <span class="text-[9px] uppercase font-bold">Galeria</span>
                              </>
                            )}
                          </button>
                          <input
                            id="foto-avaria-fechamento-galeria-input"
                            type="file"
                            accept="image/*"
                            onChange={(e) => {
                              if (e.target.files[0]) handleFotoAvaria(e.target.files[0]);
                            }}
                            class="hidden"
                          />
                        </>
                      )}
                    </div>
                  </div>

                  <div class="flex justify-end pt-2">
                    <button
                      type="button"
                      onClick={handleAddAvaria}
                      disabled={!novasAvariasDesc.trim() || loadingFotoAvaria}
                      class="px-4 py-2.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 disabled:opacity-40 disabled:pointer-events-none rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 btn-tactile"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      ADICIONAR ESTA AVARIA
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>

          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-rose-400 flex items-center gap-2">
              <i data-lucide="camera" class="w-4 h-4"></i>
              Fotos Obrigatórias de Fechamento*
            </h3>
            <p class="text-xs text-slate-400 -mt-2">Tire pelo menos 1 foto nítida do veículo.</p>

            <div class="grid grid-cols-3 gap-3">
              {fotosFechamento.map((url, i) => (
                <div key={i} class="relative w-full h-24 rounded-xl border border-slate-800 overflow-hidden">
                  <img src={url} alt="Fechamento" class="w-full h-full object-cover" />
                  <button
                    type="button"
                    onClick={() => setFotosFechamento(fotosFechamento.filter((_, idx) => idx !== i))}
                    class="absolute top-1 right-1 p-1 bg-red-600 rounded-full text-white text-xs"
                  >
                    <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
                  </button>
                </div>
              ))}
              
              <div class="grid grid-cols-2 gap-3 w-full col-span-3">
                <button
                  type="button"
                  onClick={() => document.getElementById('foto-fechamento-camera-input').click()}
                  disabled={loadingFotoFechamento}
                  class="h-24 bg-rose-950/20 hover:bg-rose-900/20 text-rose-400 border border-dashed border-rose-500/30 rounded-xl flex flex-col items-center justify-center gap-1 transition-all disabled:opacity-55 btn-tactile"
                >
                  {loadingFotoFechamento ? (
                    <div class="w-6 h-6 border-2 border-rose-400 border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                      <span class="text-2xs font-semibold uppercase tracking-wider">Câmera</span>
                    </>
                  )}
                </button>
                <input
                  id="foto-fechamento-camera-input"
                  type="file"
                  accept="image/*"
                  capture="environment"
                  onChange={(e) => {
                    if (e.target.files[0]) handleAddFotoFechamento(e.target.files[0]);
                  }}
                  class="hidden"
                />

                <button
                  type="button"
                  onClick={() => document.getElementById('foto-fechamento-galeria-input').click()}
                  disabled={loadingFotoFechamento}
                  class="h-24 bg-slate-800/40 hover:bg-slate-800 text-slate-400 border border-dashed border-slate-700 hover:border-slate-500 rounded-xl flex flex-col items-center justify-center gap-1 transition-all disabled:opacity-55 btn-tactile"
                >
                  {loadingFotoFechamento ? (
                    <div class="w-6 h-6 border-2 border-slate-400 border-t-transparent rounded-full animate-spin"></div>
                  ) : (
                    <>
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                      <span class="text-2xs font-semibold uppercase tracking-wider">Galeria</span>
                    </>
                  )}
                </button>
                <input
                  id="foto-fechamento-galeria-input"
                  type="file"
                  accept="image/*"
                  onChange={(e) => {
                    if (e.target.files[0]) handleAddFotoFechamento(e.target.files[0]);
                  }}
                  class="hidden"
                />
              </div>
            </div>
          </div>

          {/* OBSERVAÇÕES GERAIS */}
          <div class="glass-card rounded-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold uppercase tracking-wider text-rose-400 flex items-center gap-2">
              <i data-lucide="message-square" class="w-4 h-4"></i>
              Observações de Fechamento
            </h3>
            <p class="text-xs text-slate-400 -mt-2">Registre qualquer ocorrência, alteração ou observação relevante sobre o plantão.</p>
            <textarea
              placeholder="Descreva aqui observações gerais sobre a viatura, materiais ou ocorrências do plantão..."
              value={observacoesFechamento}
              onChange={(e) => setObservacoesFechamento(e.target.value)}
              class="glass-input w-full p-4 rounded-xl text-sm focus:outline-none h-24 text-slate-200"
            />
          </div>

          <button
            type="button"
            onClick={handleEncerrarPlantao}
            disabled={salvando}
            class="btn-tactile w-full py-4.5 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white rounded-2xl text-base font-bold transition-all shadow-lg shadow-rose-600/25 disabled:opacity-50"
          >
            {salvando ? (
              <div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin mx-auto"></div>
            ) : (
              'CONCLUIR E ENCERRAR PLANTÃO'
            )}
          </button>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
